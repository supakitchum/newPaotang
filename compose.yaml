services:
  local-proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/local-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - customer
      - back-office
      - platform-api

  platform-api:
    build:
      context: ./apps/platform-api
      dockerfile: Dockerfile
      target: development
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    environment:
      WORKSPACE_ROOT: /workspace
      APP_ENV: local
      APP_KEY: base64:bmV3cGFvdGFuZy1sb2NhbC1kZXYta2V5LTEyMzQ1Njc=
      APP_DEBUG: "true"
      APP_TIMEZONE: Asia/Bangkok
      TZ: Asia/Bangkok
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: newpaotang
      DB_USERNAME: newpaotang
      DB_PASSWORD: newpaotang
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: newpaotang-local
      REVERB_APP_KEY: newpaotang-admin
      REVERB_APP_SECRET: newpaotang-admin-secret
      REVERB_HOST: platform-api-reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      LOTTO_SCRAPER_HMAC_SECRET: newpaotang-local-lotto-scraper-secret
      LOTTO_SCRAPER_TRIGGER_URL: http://lotto-scraper:3200/internal/poll
      LOTTO_SCRAPER_TRIGGER_SECRET: newpaotang-local-lotto-scraper-secret
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace:ro
      - ./apps/platform-api:/var/www/html
      - platform-api-vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  platform-api-worker:
    profiles: ["worker"]
    build:
      context: ./apps/platform-api
      dockerfile: Dockerfile
      target: development
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90 --queue=${PLATFORM_WORKER_QUEUES:-partner-inbox-high,partner-inbox-normal,stock-allocation,stock-generation,stock-image-generation,stock-partner-image-generation,stock-sold-events,stock-recall,stock-sync,reservation-expiration,checkout-finalize,central-outbox,affiliate-commission,reward-validate,reward-check-high,reward-check-normal,reward-summary,reward-publish,reward-notification,report-build,webhook-dispatch,notification,usage-metering,partner-monitoring,default}
    environment:
      WORKSPACE_ROOT: /workspace
      APP_ENV: local
      APP_KEY: base64:bmV3cGFvdGFuZy1sb2NhbC1kZXYta2V5LTEyMzQ1Njc=
      APP_DEBUG: "true"
      APP_TIMEZONE: Asia/Bangkok
      TZ: Asia/Bangkok
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: newpaotang
      DB_USERNAME: newpaotang
      DB_PASSWORD: newpaotang
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: newpaotang-local
      REVERB_APP_KEY: newpaotang-admin
      REVERB_APP_SECRET: newpaotang-admin-secret
      REVERB_HOST: platform-api-reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      LOTTO_SCRAPER_HMAC_SECRET: newpaotang-local-lotto-scraper-secret
      LOTTO_SCRAPER_TRIGGER_URL: http://lotto-scraper:3200/internal/poll
      LOTTO_SCRAPER_TRIGGER_SECRET: newpaotang-local-lotto-scraper-secret
    volumes:
      - ./:/workspace:ro
      - ./apps/platform-api:/var/www/html
      - platform-api-vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  platform-api-reverb:
    profiles: ["realtime"]
    build:
      context: ./apps/platform-api
      dockerfile: Dockerfile
      target: development
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      WORKSPACE_ROOT: /workspace
      APP_ENV: local
      APP_KEY: base64:bmV3cGFvdGFuZy1sb2NhbC1kZXYta2V5LTEyMzQ1Njc=
      APP_DEBUG: "true"
      APP_TIMEZONE: Asia/Bangkok
      TZ: Asia/Bangkok
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: newpaotang
      DB_USERNAME: newpaotang
      DB_PASSWORD: newpaotang
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REVERB_APP_ID: newpaotang-local
      REVERB_APP_KEY: newpaotang-admin
      REVERB_APP_SECRET: newpaotang-admin-secret
      REVERB_HOST: localhost
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace:ro
      - ./apps/platform-api:/var/www/html
      - platform-api-vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  platform-api-scheduler:
    profiles: ["scheduler"]
    build:
      context: ./apps/platform-api
      dockerfile: Dockerfile
      target: development
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      WORKSPACE_ROOT: /workspace
      APP_ENV: local
      APP_KEY: base64:bmV3cGFvdGFuZy1sb2NhbC1kZXYta2V5LTEyMzQ1Njc=
      APP_DEBUG: "true"
      APP_TIMEZONE: Asia/Bangkok
      TZ: Asia/Bangkok
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: newpaotang
      DB_USERNAME: newpaotang
      DB_PASSWORD: newpaotang
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
    volumes:
      - ./:/workspace:ro
      - ./apps/platform-api:/var/www/html
      - platform-api-vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  lotto-scraper:
    profiles: ["scraper"]
    build:
      context: ./apps/lotto-scraper
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Bangkok
      LOG_LEVEL: info
      LOTTO_SCRAPER_PLATFORM_API_URL: http://platform-api:8000/api/v1
      LOTTO_SCRAPER_REDIS_URL: redis://valkey:6379
      LOTTO_SCRAPER_SOURCE_BASE_URL: https://news.sanook.com/lotto/check
      LOTTO_SCRAPER_HMAC_SECRET: newpaotang-local-lotto-scraper-secret
      LOTTO_SCRAPER_TRIGGER_SECRET: newpaotang-local-lotto-scraper-secret
      LOTTO_SCRAPER_HEALTH_PORT: "3200"
      LOTTO_SCRAPER_MIN_CRAWL_DELAY_MS: "10000"
      LOTTO_SCRAPER_POLL_WARMUP_MS: "60000"
      LOTTO_SCRAPER_POLL_LIVE_MIN_MS: "10000"
      LOTTO_SCRAPER_POLL_LIVE_MAX_MS: "15000"
      LOTTO_SCRAPER_POLL_TAIL_MIN_MS: "30000"
      LOTTO_SCRAPER_POLL_TAIL_MAX_MS: "60000"
    expose:
      - "3200"
    restart: unless-stopped
    depends_on:
      platform-api:
        condition: service_started
      valkey:
        condition: service_healthy

  platform-api-smoke:
    profiles: ["smoke"]
    build:
      context: ./apps/platform-api
      dockerfile: Dockerfile
      target: development
    working_dir: /var/www/html
    command: php artisan platform:smoke
    environment:
      WORKSPACE_ROOT: /workspace
      APP_ENV: local
      APP_KEY: base64:bmV3cGFvdGFuZy1sb2NhbC1kZXYta2V5LTEyMzQ1Njc=
      APP_DEBUG: "true"
      APP_TIMEZONE: Asia/Bangkok
      TZ: Asia/Bangkok
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: newpaotang
      DB_USERNAME: newpaotang
      DB_PASSWORD: newpaotang
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
    volumes:
      - ./:/workspace:ro
      - ./apps/platform-api:/var/www/html
      - platform-api-vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  customer:
    build:
      context: apps/customer
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    command: sh -lc "mkdir -p /tmp/newpaotang-customer-nuxt && ln -sfn /app/node_modules /tmp/node_modules && ln -sfn /app/node_modules /tmp/newpaotang-customer-nuxt/node_modules && node scripts/prepare-nuxt-build-dir.mjs && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      NUXT_PUBLIC_API_BASE_URL: /api/v1
      NUXT_PLATFORM_API_INTERNAL_BASE_URL: http://platform-api:8000/api/v1
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
      NUXT_PUBLIC_CUSTOMER_REALTIME_URL: http://localhost:8080
      NUXT_PUBLIC_CUSTOMER_REALTIME_KEY: newpaotang-admin
      NUXT_BUILD_DIR: /tmp/newpaotang-customer-nuxt
      NITRO_NO_UNIX_SOCKET: "1"
      NODE_OPTIONS: --no-deprecation
    ports:
      - "3000:3000"
    volumes:
      - ./apps/customer:/app
      - ./apps:/apps:ro
      - ./apps/platform-api:/platform-api:ro
      - customer-node-modules:/app/node_modules
      - customer-nuxt:/app/.nuxt

  back-office:
    build:
      context: apps/back-office
      dockerfile: Dockerfile
      target: deps
    working_dir: /app
    command: sh -lc "mkdir -p /tmp/newpaotang-back-office-nuxt && ln -sfn /app/node_modules /tmp/node_modules && ln -sfn /app/node_modules /tmp/newpaotang-back-office-nuxt/node_modules && npm run dev"
    environment:
      VITE_ADMIN_API_BASE: /api/v1
      VITE_ADMIN_REALTIME_URL: http://localhost:8080
      VITE_ADMIN_REALTIME_KEY: newpaotang-admin
      NUXT_BUILD_DIR: /tmp/newpaotang-back-office-nuxt
      NITRO_NO_UNIX_SOCKET: "1"
      NODE_OPTIONS: --no-deprecation
    ports:
      - "3100:3100"
    volumes:
      - ./apps/back-office:/app
      - back-office-node-modules:/app/node_modules
      - back-office-nuxt:/app/.nuxt

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: newpaotang
      POSTGRES_USER: newpaotang
      POSTGRES_PASSWORD: newpaotang
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newpaotang -d newpaotang"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  platform-api-vendor:
  customer-node-modules:
  customer-nuxt:
  back-office-node-modules:
  back-office-nuxt:
  postgres-data:
  valkey-data:
