apiVersion: v1
kind: ConfigMap
metadata:
  name: newpaotang-platform-config
  labels:
    app.kubernetes.io/name: newpaotang
data:
  APP_NAME: "NewPaotang Platform API"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_TIMEZONE: "Asia/Bangkok"
  TZ: "Asia/Bangkok"
  APP_URL: "https://api.siamblend.com"
  PLATFORM_PUBLIC_SITE_URL: "https://siamblend.com"
  PLATFORM_BACK_OFFICE_URL: "https://admin.siamblend.com"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"
  DB_CONNECTION: "pgsql"
  DB_PORT: "25060"
  DB_TIMEZONE: "Asia/Bangkok"
  CACHE_STORE: "redis"
  QUEUE_CONNECTION: "redis"
  SESSION_DRIVER: "redis"
  REDIS_CLIENT: "predis"
  REDIS_PORT: "25061"
  REDIS_DB: "0"
  REDIS_CACHE_DB: "1"
  BROADCAST_CONNECTION: "reverb"
  REVERB_APP_ID: "newpaotang-prod"
  REVERB_APP_KEY: "newpaotang-admin"
  REVERB_HOST: "platform-api-reverb"
  REVERB_PORT: "8080"
  REVERB_SCHEME: "http"
  REVERB_SERVER_HOST: "0.0.0.0"
  REVERB_SERVER_PORT: "8080"
  REVERB_MAX_REQUEST_SIZE: "64000"
  REVERB_APP_MAX_MESSAGE_SIZE: "64000"
  REVERB_SCALING_ENABLED: "true"
  TOPUP_QR_TTL_SECONDS: "300"
  DEEPAY_KBANK_CALLBACK_TRUSTED_IPS: "159.65.135.215"
  GOOGLE_APPLICATION_CREDENTIALS: "/var/run/secrets/newpaotang/firebase-service-account.json"
  FIREBASE_MESSAGING_ENDPOINT: "https://fcm.googleapis.com/v1"
  FIREBASE_MESSAGING_TIMEOUT: "15"
  CUSTOMER_PUSH_DEVICE_STALE_DAYS: "270"
  CUSTOMER_PASSKEY_ADDITIONAL_ALLOWED_ORIGINS: "https://siamblend.com"
  CUSTOMER_PASSKEY_IOS_APP_IDS: "VQUAKW84GK.com.siamblend"
  CUSTOMER_PASSKEY_ANDROID_PACKAGE_NAME: "com.siamblend"
  FILESYSTEM_DISK: "s3"
  S3_REGION: "sgp1"
  S3_USE_PATH_STYLE_ENDPOINT: "false"
  CDN_BASE_URL: "https://cdn.lottery80.online"
  LOTTERY_IMAGE_LOCAL_PUBLIC_BASE_URL: "https://api.siamblend.com/api/v1/public/assets"
  LOTTERY_IMAGE_BACKGROUND_ZIP_MAX_ENTRIES: "150"
  TICKET_IMAGE_CDN_REQUIRED: "true"
  PLATFORM_OBSERVABILITY_ENABLED: "true"
  PLATFORM_OBSERVABILITY_ENV: "production"
  PLATFORM_ALERTS_ENABLED: "true"
  PLATFORM_ALERT_CHANNELS: "database,log"
  PLATFORM_WORKER_QUEUES: "partner-inbox-high,partner-inbox-normal,stock-allocation,stock-generation,stock-image-generation,stock-partner-image-generation,stock-sold-events,stock-recall,stock-sync,reservation-expiration,checkout-finalize,central-outbox,affiliate-commission,reward-validate,reward-check-high,reward-check-normal,reward-summary,reward-publish,reward-notification,report-build,webhook-dispatch,notification,usage-metering,partner-monitoring,default"
  LOTTO_SCRAPER_TRIGGER_URL: "http://lotto-scraper-sanook:3200/internal/poll"
  LOTTO_SCRAPER_TRIGGER_URLS: "http://lotto-scraper-sanook:3200/internal/poll,http://lotto-scraper-thairath:3200/internal/poll"
  LOTTO_SCRAPER_TRIGGER_SANOOK_URL: "http://lotto-scraper-sanook:3200/internal/poll"
  LOTTO_SCRAPER_TRIGGER_THAIRATH_URL: "http://lotto-scraper-thairath:3200/internal/poll"
  LOTTO_SCRAPER_TRIGGER_TIMEOUT_SECONDS: "15"
  SUPPORT_API_URL: "https://api.siamblend.com/support-api/v1"
  SUPPORT_REALTIME_URL: "wss://support-realtime.siamblend.com"
  SUPPORT_REALTIME_KEY: "newpaotang-support"
  SUPPORT_JWT_ISSUER: "newpaotang-platform-api"
  SUPPORT_JWT_AUDIENCE: "newpaotang-support"
  SUPPORT_JWT_TTL_SECONDS: "600"
  SUPPORT_JWT_PRIVATE_KEY_PATH: "/var/run/secrets/newpaotang/support-jwt-private.pem"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: newpaotang-customer-config
  labels:
    app.kubernetes.io/name: newpaotang-customer
data:
  NODE_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "3000"
  NUXT_PUBLIC_API_BASE_URL: "/api/v1"
  NUXT_PLATFORM_API_INTERNAL_BASE_URL: "http://platform-api:8000/api/v1"
  NUXT_PUBLIC_CUSTOMER_REALTIME_URL: "wss://realtime.siamblend.com"
  NUXT_PUBLIC_CUSTOMER_REALTIME_KEY: "newpaotang-admin"
  NUXT_PUBLIC_WAITING_RESULT_YOUTUBE_URL: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: newpaotang-back-office-config
  labels:
    app.kubernetes.io/name: newpaotang-back-office
data:
  NODE_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "3100"
  NUXT_PUBLIC_ADMIN_API_BASE: "https://api.siamblend.com/api/v1"
  NUXT_PUBLIC_ADMIN_REALTIME_URL: "wss://realtime.siamblend.com"
  NUXT_PUBLIC_ADMIN_REALTIME_KEY: "newpaotang-admin"
---
apiVersion: v1
