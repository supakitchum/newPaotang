apiVersion: v1
kind: Secret
metadata:
  name: newpaotang-platform-secret
  namespace: newpaotang-prod
type: Opaque
stringData:
  APP_KEY: "base64:REPLACE_WITH_PRODUCTION_APP_KEY"
  DB_HOST: "REPLACE_WITH_MANAGED_POSTGRES_HOST"
  DB_DATABASE: "newpaotang"
  DB_USERNAME: "doadmin"
  DB_PASSWORD: "REPLACE_WITH_MANAGED_POSTGRES_PASSWORD"
  REDIS_HOST: "tls://REPLACE_WITH_MANAGED_VALKEY_HOST"
  REDIS_PASSWORD: "REPLACE_WITH_MANAGED_VALKEY_PASSWORD"
  REDIS_URL: "rediss://default:REPLACE_WITH_MANAGED_VALKEY_PASSWORD@REPLACE_WITH_MANAGED_VALKEY_HOST:25061/0"
  S3_ENDPOINT: "https://REPLACE_WITH_SPACE_REGION.digitaloceanspaces.com"
  S3_ACCESS_KEY_ID: "REPLACE_WITH_SPACES_ACCESS_KEY"
  S3_SECRET_ACCESS_KEY: "REPLACE_WITH_SPACES_SECRET_KEY"
  S3_BUCKET: "REPLACE_WITH_SPACE_NAME"
  REVERB_APP_SECRET: "REPLACE_WITH_REVERB_SECRET"
  PLATFORM_SUPPORT_INGRESS_SECRET: "REPLACE_WITH_SUPPORT_INGRESS_HMAC_SECRET"
  support-jwt-private.pem: |-
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_SUPPORT_JWT_PRIVATE_KEY
    -----END PRIVATE KEY-----
  LOTTO_SCRAPER_HMAC_SECRET: "REPLACE_WITH_SHARED_LOTTO_SCRAPER_HMAC_SECRET"
  LOTTO_SCRAPER_TRIGGER_SECRET: "REPLACE_WITH_SHARED_LOTTO_SCRAPER_TRIGGER_SECRET"
  PLATFORM_ALERT_WEBHOOK_URL: ""
  FIREBASE_PROJECT_ID: "REPLACE_WITH_PLATFORM_FIREBASE_PROJECT_ID"
  firebase-service-account.json: |-
    {
      "type": "service_account",
      "project_id": "REPLACE_WITH_PLATFORM_FIREBASE_PROJECT_ID",
      "private_key_id": "REPLACE_WITH_FIREBASE_PRIVATE_KEY_ID",
      "private_key": "-----BEGIN PRIVATE KEY-----\nREPLACE_WITH_FIREBASE_PRIVATE_KEY\n-----END PRIVATE KEY-----\n",
      "client_email": "REPLACE_WITH_FIREBASE_SERVICE_ACCOUNT_EMAIL",
      "client_id": "REPLACE_WITH_FIREBASE_CLIENT_ID",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "REPLACE_WITH_FIREBASE_CLIENT_CERT_URL",
      "universe_domain": "googleapis.com"
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: newpaotang-lotto-scraper-secret
  namespace: newpaotang-prod
type: Opaque
stringData:
  LOTTO_SCRAPER_HMAC_SECRET: "REPLACE_WITH_SHARED_LOTTO_SCRAPER_HMAC_SECRET"
  LOTTO_SCRAPER_TRIGGER_SECRET: "REPLACE_WITH_SHARED_LOTTO_SCRAPER_TRIGGER_SECRET"
  LOTTO_SCRAPER_REDIS_URL: "rediss://default:REPLACE_WITH_MANAGED_VALKEY_PASSWORD@REPLACE_WITH_MANAGED_VALKEY_HOST:25061/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: newpaotang-support-secret
  namespace: newpaotang-prod
type: Opaque
stringData:
  APP_KEY: "base64:REPLACE_WITH_SUPPORT_APP_KEY"
  DB_HOST: "REPLACE_WITH_ISOLATED_SUPPORT_POSTGRES_HOST"
  DB_DATABASE: "newpaotang_support"
  DB_USERNAME: "doadmin"
  DB_PASSWORD: "REPLACE_WITH_ISOLATED_SUPPORT_POSTGRES_PASSWORD"
  REDIS_HOST: "tls://REPLACE_WITH_ISOLATED_SUPPORT_VALKEY_HOST"
  REDIS_PASSWORD: "REPLACE_WITH_ISOLATED_SUPPORT_VALKEY_PASSWORD"
  REDIS_URL: "rediss://default:REPLACE_WITH_ISOLATED_SUPPORT_VALKEY_PASSWORD@REPLACE_WITH_ISOLATED_SUPPORT_VALKEY_HOST:25061/0"
  REVERB_APP_SECRET: "REPLACE_WITH_SUPPORT_REVERB_SECRET"
  PLATFORM_SUPPORT_INGRESS_SECRET: "REPLACE_WITH_SUPPORT_INGRESS_HMAC_SECRET"
  AWS_ENDPOINT: "https://REPLACE_WITH_SPACE_REGION.digitaloceanspaces.com"
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_SUPPORT_SPACES_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_SUPPORT_SPACES_SECRET_KEY"
  SUPPORT_AWS_BUCKET: "REPLACE_WITH_PRIVATE_SUPPORT_SPACE_NAME"
  support-jwt-public.pem: |-
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_SUPPORT_JWT_PUBLIC_KEY
    -----END PUBLIC KEY-----
