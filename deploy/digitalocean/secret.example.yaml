apiVersion: v1
kind: Secret
metadata:
  name: newpaotang-platform-secret
  namespace: newpaotang-prod
type: Opaque
stringData:
  APP_KEY: "base64:REPLACE_WITH_PRODUCTION_APP_KEY"
  DB_HOST: "REPLACE_WITH_MANAGED_POSTGRES_HOST"
  DB_DATABASE: "newpaotang"
  DB_USERNAME: "doadmin"
  DB_PASSWORD: "REPLACE_WITH_MANAGED_POSTGRES_PASSWORD"
  REDIS_HOST: "tls://REPLACE_WITH_MANAGED_VALKEY_HOST"
  REDIS_PASSWORD: "REPLACE_WITH_MANAGED_VALKEY_PASSWORD"
  REDIS_URL: "rediss://default:REPLACE_WITH_MANAGED_VALKEY_PASSWORD@REPLACE_WITH_MANAGED_VALKEY_HOST:25061/0"
  S3_ENDPOINT: "https://REPLACE_WITH_SPACE_REGION.digitaloceanspaces.com"
  S3_ACCESS_KEY_ID: "REPLACE_WITH_SPACES_ACCESS_KEY"
  S3_SECRET_ACCESS_KEY: "REPLACE_WITH_SPACES_SECRET_KEY"
  S3_BUCKET: "REPLACE_WITH_SPACE_NAME"
  REVERB_APP_SECRET: "REPLACE_WITH_REVERB_SECRET"
  LOTTO_SCRAPER_HMAC_SECRET: "REPLACE_WITH_SHARED_LOTTO_SCRAPER_HMAC_SECRET"
  LOTTO_SCRAPER_TRIGGER_SECRET: "REPLACE_WITH_SHARED_LOTTO_SCRAPER_TRIGGER_SECRET"
  PLATFORM_ALERT_WEBHOOK_URL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: newpaotang-lotto-scraper-secret
  namespace: newpaotang-prod
type: Opaque
stringData:
  LOTTO_SCRAPER_HMAC_SECRET: "REPLACE_WITH_SHARED_LOTTO_SCRAPER_HMAC_SECRET"
  LOTTO_SCRAPER_TRIGGER_SECRET: "REPLACE_WITH_SHARED_LOTTO_SCRAPER_TRIGGER_SECRET"
  LOTTO_SCRAPER_REDIS_URL: "rediss://default:REPLACE_WITH_MANAGED_VALKEY_PASSWORD@REPLACE_WITH_MANAGED_VALKEY_HOST:25061/0"
