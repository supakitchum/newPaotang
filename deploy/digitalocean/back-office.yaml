apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-office
  labels:
    app.kubernetes.io/name: back-office
    app.kubernetes.io/part-of: newpaotang
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: back-office
  template:
    metadata:
      labels:
        app.kubernetes.io/name: back-office
        app.kubernetes.io/part-of: newpaotang
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: back-office
          image: newpaotang/back-office:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
          envFrom:
            - configMapRef:
                name: newpaotang-back-office-config
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: back-office
  labels:
    app.kubernetes.io/name: back-office
spec:
  selector:
    app.kubernetes.io/name: back-office
  ports:
    - name: http
      port: 3100
      targetPort: http
