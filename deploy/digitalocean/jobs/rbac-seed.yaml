apiVersion: batch/v1
kind: Job
metadata:
  name: ${RBAC_SEED_JOB_NAME}
  namespace: newpaotang-prod
  labels:
    app.kubernetes.io/name: platform-api-rbac-seed
    app.kubernetes.io/part-of: newpaotang
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api-rbac-seed
    spec:
      restartPolicy: Never
      containers:
        - name: rbac-seed
          image: ${PLATFORM_API_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - php artisan db:seed --class=DefaultRbacMenuSeeder --force && php artisan optimize:clear
          envFrom:
            - configMapRef:
                name: newpaotang-platform-config
            - secretRef:
                name: newpaotang-platform-secret
