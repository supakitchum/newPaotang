apiVersion: batch/v1
kind: Job
metadata:
  name: ${MIGRATION_JOB_NAME}
  namespace: newpaotang-prod
  labels:
    app.kubernetes.io/name: platform-api-migrate
    app.kubernetes.io/part-of: newpaotang
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ${PLATFORM_API_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - php artisan migrate --force
          envFrom:
            - configMapRef:
                name: newpaotang-platform-config
            - secretRef:
                name: newpaotang-platform-secret
