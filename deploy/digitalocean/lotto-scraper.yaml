apiVersion: apps/v1
kind: Deployment
metadata:
  name: lotto-scraper-sanook
  labels:
    app.kubernetes.io/name: lotto-scraper-sanook
    app.kubernetes.io/part-of: newpaotang
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lotto-scraper-sanook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lotto-scraper-sanook
        app.kubernetes.io/part-of: newpaotang
    spec:
      containers:
        - name: lotto-scraper
          image: newpaotang/lotto-scraper:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 3200
          envFrom:
            - configMapRef:
                name: newpaotang-lotto-scraper-config
            - secretRef:
                name: newpaotang-lotto-scraper-secret
          env:
            - name: LOTTO_SCRAPER_SOURCE
              value: sanook
            - name: LOTTO_SCRAPER_SOURCE_BASE_URL
              value: https://news.sanook.com/lotto/check
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lotto-scraper-sanook
  labels:
    app.kubernetes.io/name: lotto-scraper-sanook
spec:
  selector:
    app.kubernetes.io/name: lotto-scraper-sanook
  ports:
    - name: health
      port: 3200
      targetPort: health
---
