apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-api
  labels:
    app.kubernetes.io/name: support-api
    app.kubernetes.io/part-of: newpaotang
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: support-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-api
        app.kubernetes.io/part-of: newpaotang
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: support-api
          image: newpaotang/support-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - php
            - artisan
            - serve
            - --host=0.0.0.0
            - --port=8100
            - --no-reload
          ports:
            - name: http
              containerPort: 8100
          envFrom:
            - configMapRef:
                name: newpaotang-support-config
            - secretRef:
                name: newpaotang-support-secret
          volumeMounts:
            - name: support-jwt-public-key
              mountPath: /var/run/secrets/newpaotang-support
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: support-jwt-public-key
          secret:
            secretName: newpaotang-support-secret
            items:
              - key: support-jwt-public.pem
                path: support-jwt-public.pem
---
apiVersion: v1
kind: Service
metadata:
  name: support-api
  labels:
    app.kubernetes.io/name: support-api
spec:
  selector:
    app.kubernetes.io/name: support-api
  ports:
    - name: http
      port: 8100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-api-worker
  labels:
    app.kubernetes.io/name: support-api-worker
    app.kubernetes.io/part-of: newpaotang
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: support-api-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-api-worker
        app.kubernetes.io/part-of: newpaotang
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: newpaotang/support-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - php
            - artisan
            - queue:work
            - --sleep=1
            - --tries=3
            - --timeout=90
            - --queue=support,default
          envFrom:
            - configMapRef:
                name: newpaotang-support-config
            - secretRef:
                name: newpaotang-support-secret
          volumeMounts:
            - name: support-jwt-public-key
              mountPath: /var/run/secrets/newpaotang-support
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: support-jwt-public-key
          secret:
            secretName: newpaotang-support-secret
            items:
              - key: support-jwt-public.pem
                path: support-jwt-public.pem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-api-scheduler
  labels:
    app.kubernetes.io/name: support-api-scheduler
    app.kubernetes.io/part-of: newpaotang
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: support-api-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-api-scheduler
        app.kubernetes.io/part-of: newpaotang
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: scheduler
          image: newpaotang/support-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - while true; do php artisan schedule:run --no-interaction; sleep 60; done
          envFrom:
            - configMapRef:
                name: newpaotang-support-config
            - secretRef:
                name: newpaotang-support-secret
          volumeMounts:
            - name: support-jwt-public-key
              mountPath: /var/run/secrets/newpaotang-support
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: support-jwt-public-key
          secret:
            secretName: newpaotang-support-secret
            items:
              - key: support-jwt-public.pem
                path: support-jwt-public.pem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-api-reverb
  labels:
    app.kubernetes.io/name: support-api-reverb
    app.kubernetes.io/part-of: newpaotang
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: support-api-reverb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-api-reverb
        app.kubernetes.io/part-of: newpaotang
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: reverb
          image: newpaotang/support-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - php
            - artisan
            - reverb:start
            - --host=0.0.0.0
            - --port=8081
          ports:
            - name: ws
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: newpaotang-support-config
            - secretRef:
                name: newpaotang-support-secret
          volumeMounts:
            - name: support-jwt-public-key
              mountPath: /var/run/secrets/newpaotang-support
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: support-jwt-public-key
          secret:
            secretName: newpaotang-support-secret
            items:
              - key: support-jwt-public.pem
                path: support-jwt-public.pem
---
apiVersion: v1
kind: Service
metadata:
  name: support-api-reverb
  labels:
    app.kubernetes.io/name: support-api-reverb
spec:
  selector:
    app.kubernetes.io/name: support-api-reverb
  ports:
    - name: ws
      port: 8081
      targetPort: ws
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: support-api-public
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "40m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.lottery80.online
      secretName: newpaotang-public-tls
  rules:
    - host: api.lottery80.online
      http:
        paths:
          - path: /support-api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: support-api
                port:
                  number: 8100
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: support-realtime-public
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - support-realtime.lottery80.online
      secretName: newpaotang-public-tls
  rules:
    - host: support-realtime.lottery80.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: support-api-reverb
                port:
                  number: 8081
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: support-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: support-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: support-api-reverb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: support-api-reverb
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: support-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: support-api
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
