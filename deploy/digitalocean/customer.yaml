apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
  labels:
    app.kubernetes.io/name: customer
    app.kubernetes.io/part-of: newpaotang
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer
        app.kubernetes.io/part-of: newpaotang
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: customer
          image: newpaotang/customer:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: newpaotang-customer-config
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer
  labels:
    app.kubernetes.io/name: customer
spec:
  selector:
    app.kubernetes.io/name: customer
  ports:
    - name: http
      port: 3000
      targetPort: http
