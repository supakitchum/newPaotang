apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api-scheduler
  labels:
    app.kubernetes.io/name: platform-api-scheduler
    app.kubernetes.io/part-of: newpaotang
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api-scheduler
        app.kubernetes.io/part-of: newpaotang
    spec:
      containers:
        - name: scheduler
          image: newpaotang/platform-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - while true; do php artisan schedule:run --no-interaction; sleep 60; done
          envFrom:
            - configMapRef:
                name: newpaotang-platform-config
            - secretRef:
                name: newpaotang-platform-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
