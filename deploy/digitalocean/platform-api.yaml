  labels:
    app.kubernetes.io/name: platform-api-worker-default
    app.kubernetes.io/part-of: newpaotang
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api-worker-default
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api-worker-default
        app.kubernetes.io/part-of: newpaotang
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: newpaotang/platform-api:latest
          imagePullPolicy: IfNotPresent
          command:
