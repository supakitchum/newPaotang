apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: newpaotang
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/part-of: newpaotang
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: platform-api
          image: newpaotang/platform-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          command:
            - sh
            - -lc
            - php -S 0.0.0.0:8000 -t public public/index.php
          envFrom:
            - configMapRef:
                name: newpaotang-platform-config
            - secretRef:
                name: newpaotang-platform-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  labels:
    app.kubernetes.io/name: platform-api
spec:
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api-worker-critical
  labels:
    app.kubernetes.io/name: platform-api-worker-critical
    app.kubernetes.io/part-of: newpaotang
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api-worker-critical
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api-worker-critical
        app.kubernetes.io/part-of: newpaotang
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: newpaotang/platform-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - php artisan queue:work --sleep=1 --tries=3 --timeout=120 --queue=partner-inbox-high,stock-allocation,reservation-expiration,checkout-finalize,reward-check-high,reward-publish,notification,default
          envFrom:
            - configMapRef:
                name: newpaotang-platform-config
            - secretRef:
                name: newpaotang-platform-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
