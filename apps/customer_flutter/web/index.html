  <style>
    :root {
      --customer-theme-color: #087FF0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--customer-theme-color);

    flutter-view {

    #customer-bootstrap-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      display: flex;
      box-sizing: border-box;
      align-items: flex-end;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        16px
        max(28px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(28px, env(safe-area-inset-left));
      overflow: hidden;
      background-color: #0b96dc;
      background-image:
        linear-gradient(
          to bottom,
          transparent 0%,
          transparent 72%,
          rgba(3, 78, 145, 0.10) 100%
        ),
        url("splash/siamblend_splash.jpg");
      background-position: center, center;
      background-repeat: no-repeat;
      background-size: 100% 100%, cover;
      opacity: 1;
      transition: opacity 260ms ease-out;
    }

    #customer-bootstrap-splash.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    .customer-bootstrap-loader {
      box-sizing: border-box;
      width: min(190px, 54vw);
      padding: 10px 18px 11px;
      border: 1px solid rgba(255, 255, 255, 0.30);
      border-radius: 18px;
      background: rgba(7, 90, 156, 0.65);
      box-shadow: 0 8px 20px rgba(0, 49, 94, 0.20);
      color: #fff;
      font-family: Kanit, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.25;
      text-align: center;
    }

    .customer-bootstrap-loader-track {
      position: relative;
      width: 142px;
      max-width: 100%;
      height: 4px;
      margin: 8px auto 0;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
    }

    .customer-bootstrap-loader-bar {
      position: absolute;
      inset-block: 0;
      left: -42%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, #fff2b8, #e7b64c, #ffeba0);
      box-shadow: 0 0 5px rgba(243, 204, 105, 0.60);
      animation: customer-bootstrap-loading 1350ms ease-in-out infinite;
    }

    @keyframes customer-bootstrap-loading {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(338%);
      }
    }

    @media (min-aspect-ratio: 3 / 4) {
      #customer-bootstrap-splash {
        background-size: 100% 100%, auto 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #customer-bootstrap-splash {
        transition: none;
      }

      .customer-bootstrap-loader-bar {
        left: 29%;
        animation: none;
      }
    }

    #customer-portrait-orientation-guard {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: none;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: #fff;
      color: #202633;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
    }

    @media (orientation: landscape) and (pointer: coarse) {
      #customer-portrait-orientation-guard {
        display: flex;
      }

      flutter-view {
        visibility: hidden;
      }
    }
  </style>

<body>
  <div
    id="customer-bootstrap-splash"
    role="status"
    aria-label="กำลังเตรียมแอป"
  >
    <div class="customer-bootstrap-loader" aria-hidden="true">
      <span>กำลังเตรียมแอป</span>
      <div class="customer-bootstrap-loader-track">
        <div class="customer-bootstrap-loader-bar"></div>
      </div>
    </div>
  </div>
  <div
    id="customer-portrait-orientation-guard"
    role="alert"
    aria-live="assertive"
  >
    กรุณาหมุนอุปกรณ์เป็นแนวตั้ง
  </div>
  <script>
    (function () {
      const splash = document.getElementById("customer-bootstrap-splash");
      if (!splash) return;

      window.addEventListener(
        "flutter-first-frame",
        function () {
          splash.classList.add("is-leaving");
          window.setTimeout(function () {
            splash.remove();
          }, 280);
        },
        { once: true }
      );
    })();
  </script>
  <script>
    (function () {
      let portraitOrientationLocked = false;

      function lockOrientation(orientation, value) {
        try {
          return Promise.resolve(orientation.lock(value))
            .then(function () {
              return true;
            })
            .catch(function () {
              return false;
            });
        } catch (_) {
          return Promise.resolve(false);
        }
      }

      window.customerRequestPortraitOrientation = function () {
        if (portraitOrientationLocked) {
          return Promise.resolve(true);
        }
        const orientation = window.screen && window.screen.orientation;
        if (!orientation || typeof orientation.lock !== "function") {
          return Promise.resolve(false);
        }
        return lockOrientation(orientation, "portrait-primary")
          .then(function (locked) {
            if (locked) {
              portraitOrientationLocked = true;
              return true;
            }
            return lockOrientation(orientation, "portrait");
          })
          .then(function (locked) {
            portraitOrientationLocked = locked;
            return locked;
          });
      };

      window.addEventListener(
        "load",
        window.customerRequestPortraitOrientation
      );
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          window.customerRequestPortraitOrientation();
        }
      });
      document.addEventListener(
        "pointerdown",
        window.customerRequestPortraitOrientation,
        { passive: true }
      );
    })();
  </script>
  <script src="customer-runtime-config.js"></script>
  <script>
    (function () {
      function asConfigObject(value) {
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          return {};
        }
        return value;
      }

      const runtimeConfigSources = [
        window.customerFlutterWebConfig,
        window.customerFlutterConfig,
        window.customerConfig,
        window.__CUSTOMER_FLUTTER_WEB_CONFIG__,
        window.__CUSTOMER_FLUTTER_CONFIG__,
        window.__CUSTOMER_WEB_CONFIG__,
        window.__CUSTOMER_CONFIG__
      ].map(asConfigObject).filter((source) => Object.keys(source).length > 0);

      const expandedRuntimeConfigSources = [];
      function addConfigSource(source, depth) {
        if (!source || depth > 3) {
          return;
        }
        expandedRuntimeConfigSources.push(source);
        for (const key of [
          "web",
          "pwa",
          "manifest",
          "app",
          "site",
          "brand",
          "theme",
          "mobile",
          "colors",
          "colour",
          "palette",
          "icons",
          "icon",
          "images",
          "assets",
          "seo",
          "social",
          "openGraph",
          "twitter",
          "links",
          "locale"
        ]) {
          const nested = asConfigObject(source[key]);
          if (Object.keys(nested).length > 0) {
            addConfigSource(nested, depth + 1);
          }
        }
        const mobile = asConfigObject(source.mobile);
        for (const key of ["web", "pwa", "manifest", "app", "site", "seo", "social", "theme", "brand"]) {
          const nested = asConfigObject(mobile[key]);
          if (Object.keys(nested).length > 0) {
            addConfigSource(nested, depth + 1);
          }
        }
      }
      for (const source of runtimeConfigSources) {
        addConfigSource(source, 0);
      }

      function configScalar(value) {
        if (typeof value === "string" && value.trim()) {
          return value.trim();
        }
        if (typeof value === "number" && Number.isFinite(value)) {
          return String(value);
        }
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          return "";
        }
        for (const key of [
          "value",
          "hex",
          "cssValue",
          "css_value",
          "url",
          "href",
          "src",
          "path",
          "uri",
          "publicUrl",
          "public_url",
          "assetUrl",
          "asset_url",
          "fullUrl",
          "full_url"
        ]) {
          const nested = value[key];
          if (typeof nested === "string" && nested.trim()) {
            return nested.trim();
          }
          if (typeof nested === "number" && Number.isFinite(nested)) {
            return String(nested);
          }
        }
        return "";
      }

      function firstConfigValue(keys, fallback) {
        for (const source of expandedRuntimeConfigSources) {
          for (const key of keys) {
            const value = configScalar(source[key]);
            if (value) return value;
          }
        }
        return fallback;
      }

      const appName = firstConfigValue(["appName", "webAppName", "siteName", "name", "title", "app_name", "web_app_name", "site_name", "displayName", "display_name"], "Customer");
      const shortName = firstConfigValue(["shortName", "webShortName", "appShortName", "short_name", "web_short_name", "app_short_name"], appName);
      const description = firstConfigValue(["description", "webDescription", "appDescription", "siteDescription", "web_description", "app_description", "site_description", "summary"], "Customer application.");
      function normalizeThemeColor(value) {
        const normalized = configScalar(value);
        return /^#[0-9a-fA-F]{6}$/.test(normalized)
          ? normalized.toUpperCase()
          : "#087FF0";
      }

      const themeColor = normalizeThemeColor(firstConfigValue([
        "themeColor",
        "theme_color",
        "manifestThemeColor",
        "manifest_theme_color",
        "primaryColor",
        "primary_color",
        "primary",
        "brandColor",
        "brand_color"
      ], "#087FF0"));
      const backgroundColor = firstConfigValue(["manifestBackgroundColor", "manifest_background_color", "backgroundColor", "background_color"], "#FFFFFF");
      const icon192Url = firstConfigValue(["icon192Url", "icon192URL", "iconUrl", "iconURL", "icon_192_url", "icon_url", "icon192", "icon_192"], "icons/Icon-192.png");
      const icon512Url = firstConfigValue(["icon512Url", "icon512URL", "iconUrl", "iconURL", "icon_512_url", "icon_url", "icon512", "icon_512"], "icons/Icon-512.png");
      const maskableIcon192Url = firstConfigValue(["maskableIcon192Url", "maskableIcon192URL", "maskableIconUrl", "maskableIconURL", "maskable_icon_192_url", "maskable_icon_url", "maskable192", "maskable_192"], "icons/Icon-maskable-192.png");
      const maskableIcon512Url = firstConfigValue(["maskableIcon512Url", "maskableIcon512URL", "maskableIconUrl", "maskableIconURL", "maskable_icon_512_url", "maskable_icon_url", "maskable512", "maskable_512"], "icons/Icon-maskable-512.png");
      const faviconUrl = firstConfigValue(["faviconUrl", "faviconURL", "favicon", "favicon_url", "faviconPath", "favicon_path"], icon192Url || "favicon.png");
      const appleTouchIconUrl = firstConfigValue(["appleTouchIconUrl", "appleTouchIconURL", "apple_touch_icon_url", "appleIcon", "apple_icon"], icon192Url);
      const socialTitle = firstConfigValue(["socialTitle", "ogTitle", "twitterTitle", "social_title", "og_title", "twitter_title", "title"], appName);
      const socialDescription = firstConfigValue(["socialDescription", "ogDescription", "twitterDescription", "social_description", "og_description", "twitter_description", "description"], description);
      const shareImageUrl = firstConfigValue(["shareImageUrl", "ogImageUrl", "socialImageUrl", "twitterImageUrl", "imageUrl", "share_image_url", "og_image_url", "social_image_url", "twitter_image_url", "image_url", "shareImage", "share_image"], icon512Url);
      const startUrl = firstConfigValue(["startUrl", "webStartUrl", "manifestStartUrl", "launchUrl", "start_url", "web_start_url", "manifest_start_url", "launch_url"], ".");
      const canonicalUrl = firstConfigValue(["canonicalUrl", "siteUrl", "url", "canonical_url", "site_url"], startUrl || ".");
      const manifestId = firstConfigValue(["manifestId", "webAppId", "appId", "manifest_id", "web_app_id", "app_id"], canonicalUrl);
      const manifestScope = firstConfigValue(["scope", "webScope", "manifestScope", "web_scope", "manifest_scope"], startUrl || ".");
      const manifestDisplay = firstConfigValue(["display", "displayMode", "webDisplay", "manifestDisplay", "display_mode", "web_display", "manifest_display"], "standalone");
      const manifestOrientation = "portrait-primary";
      const htmlLang = firstConfigValue(["lang", "language", "locale", "defaultLocale", "default_locale"], "");
      const htmlDir = firstConfigValue(["dir", "direction", "textDirection", "text_direction"], "");

      document.title = appName;
      if (htmlLang) {
        document.documentElement.setAttribute("lang", htmlLang);
      }
      if (htmlDir === "ltr" || htmlDir === "rtl" || htmlDir === "auto") {
        document.documentElement.setAttribute("dir", htmlDir);
      }
      document.documentElement.style.setProperty("--customer-theme-color", themeColor);
      document.body.style.setProperty("--customer-theme-color", themeColor);

      function updateMeta(selector, value) {
        const node = document.querySelector(selector);
        if (node) {
          node.setAttribute("content", value);
        }
      }

      updateMeta('meta[name="description"]', description);
      updateMeta('meta[name="theme-color"]', themeColor);
      updateMeta('meta[name="msapplication-TileColor"]', themeColor);
      updateMeta('meta[name="apple-mobile-web-app-title"]', shortName);
      updateMeta('meta[property="og:title"]', socialTitle);
      updateMeta('meta[property="og:description"]', socialDescription);
      updateMeta('meta[property="og:url"]', canonicalUrl);
      updateMeta('meta[property="og:image"]', shareImageUrl);
      updateMeta('meta[name="twitter:title"]', socialTitle);
      updateMeta('meta[name="twitter:description"]', socialDescription);
      updateMeta('meta[name="twitter:url"]', canonicalUrl);
      updateMeta('meta[name="twitter:image"]', shareImageUrl);

      function updateLink(selector, value) {
        const node = document.querySelector(selector);
        if (node && value) {
          node.setAttribute("href", value);
        }
      }

      updateLink('link[rel="icon"]', faviconUrl);
      updateLink('link[rel="apple-touch-icon"]', appleTouchIconUrl);
      updateLink('link[rel="canonical"]', canonicalUrl);

      const manifest = {
        id: manifestId,
        name: appName,
        short_name: shortName,
        start_url: startUrl,
        scope: manifestScope,
        display: manifestDisplay,
        background_color: backgroundColor,
        theme_color: themeColor,
        description: description,
        orientation: manifestOrientation,
        prefer_related_applications: false,
        icons: [
          {
            src: icon192Url,
            sizes: "192x192",
            type: "image/png"
          },
          {
            src: icon512Url,
            sizes: "512x512",
            type: "image/png"
          },
          {
            src: maskableIcon192Url,
            sizes: "192x192",
            type: "image/png",
            purpose: "maskable"
          },
          {
            src: maskableIcon512Url,
            sizes: "512x512",
            type: "image/png",
            purpose: "maskable"
          }
        ]
      };
      const manifestLink = document.querySelector('link[rel="manifest"]');
      let manifestObjectUrl = "";

      function publishManifest() {
        if (!manifestLink) return;
        const blob = new Blob([JSON.stringify(manifest)], {
          type: "application/manifest+json"
        });
        const nextManifestObjectUrl = URL.createObjectURL(blob);
        manifestLink.setAttribute("href", nextManifestObjectUrl);
        if (manifestObjectUrl) {
          URL.revokeObjectURL(manifestObjectUrl);
        }
        manifestObjectUrl = nextManifestObjectUrl;
      }

      window.customerApplyPwaIdentity = function (runtimeName, runtimeIconUrl) {
        const tenantName = configScalar(runtimeName);
        const tenantIconUrl = configScalar(runtimeIconUrl);

        if (tenantName) {
          manifest.name = tenantName;
          manifest.short_name = tenantName;
          document.title = tenantName;
          updateMeta('meta[name="apple-mobile-web-app-title"]', tenantName);
          updateMeta('meta[property="og:title"]', tenantName);
          updateMeta('meta[name="twitter:title"]', tenantName);
        }

        if (tenantIconUrl) {
          manifest.icons = [
            {
              src: tenantIconUrl,
              sizes: "192x192",
              purpose: "any"
            },
            {
              src: tenantIconUrl,
              sizes: "512x512",
              purpose: "any"
            }
          ];
          updateLink('link[rel="icon"]', tenantIconUrl);
          updateLink('link[rel="apple-touch-icon"]', tenantIconUrl);
        }

        publishManifest();
      };

      publishManifest();
    })();
  </script>
