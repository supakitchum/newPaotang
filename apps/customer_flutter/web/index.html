<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Customer application.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Customer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Customer</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function () {
      const runtimeConfig = window.customerFlutterWebConfig || {};
      const appName = runtimeConfig.appName || "Customer";
      const shortName = runtimeConfig.shortName || appName;
      const description = runtimeConfig.description || "Customer application.";
      const themeColor = runtimeConfig.themeColor || "#0175C2";
      const backgroundColor = runtimeConfig.backgroundColor || themeColor;

      document.title = appName;

      function updateMeta(selector, value) {
        const node = document.querySelector(selector);
        if (node) {
          node.setAttribute("content", value);
        }
      }

      updateMeta('meta[name="description"]', description);
      updateMeta('meta[name="apple-mobile-web-app-title"]', shortName);

      const manifest = {
        name: appName,
        short_name: shortName,
        start_url: runtimeConfig.startUrl || ".",
        display: "standalone",
        background_color: backgroundColor,
        theme_color: themeColor,
        description: description,
        orientation: "portrait-primary",
        prefer_related_applications: false,
        icons: [
          {
            src: "icons/Icon-192.png",
            sizes: "192x192",
            type: "image/png"
          },
          {
            src: "icons/Icon-512.png",
            sizes: "512x512",
            type: "image/png"
          },
          {
            src: "icons/Icon-maskable-192.png",
            sizes: "192x192",
            type: "image/png",
            purpose: "maskable"
          },
          {
            src: "icons/Icon-maskable-512.png",
            sizes: "512x512",
            type: "image/png",
            purpose: "maskable"
          }
        ]
      };
      const manifestLink = document.querySelector('link[rel="manifest"]');
      if (manifestLink) {
        const blob = new Blob([JSON.stringify(manifest)], {
          type: "application/manifest+json"
        });
        manifestLink.setAttribute("href", URL.createObjectURL(blob));
      }
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
