name: customer_flutter
description: Native-first customer app for NewPaotang partners.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^2.4.4
  go_router: ^14.6.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  image_picker: ^1.2.2
  app_links: ^7.2.0
  web: ^1.1.1
  web_socket_channel: ^3.0.3
  share_plus: ^13.2.1
  pdf: ^3.13.0
  youtube_player_iframe: ^6.0.2
  qr_flutter: ^4.1.0
dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4
  crypto: ^3.0.7
  image: ^4.9.1

flutter:
  uses-material-design: true
  fonts:
    - family: Kanit
      fonts:
        - asset: assets/fonts/kanit/Kanit-Regular.ttf
          weight: 400
        - asset: assets/fonts/kanit/Kanit-Medium.ttf
          weight: 500
        - asset: assets/fonts/kanit/Kanit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/kanit/Kanit-Bold.ttf
          weight: 700
        - asset: assets/fonts/kanit/Kanit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/kanit/Kanit-Black.ttf
          weight: 900
