server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ^~ /api/v1 {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $newpaotang_platform_api platform-api:8000;
        proxy_pass http://$newpaotang_platform_api;
    }

    location = / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location = /flutter_bootstrap.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /flutter_bootstrap.js =404;
    }

    location = /customer-runtime-config.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /customer-runtime-config.js =404;
    }

    location = /main.dart.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /main.dart.js =404;
    }

    location = /flutter_service_worker.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /flutter_service_worker.js =404;
    }

    location = /version.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /version.json =404;
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /manifest.json =404;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|wasm|json|map)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|svg|ico|woff2?|ttf|eot|otf|webp|avif)$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }
}
