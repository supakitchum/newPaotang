name: Production Deploy

on:
  push:
    branches:
      - develop
    paths:
      - "apps/**"
      - "deploy/digitalocean/**"
      - "deploy/digitalocean-support/**"
      - ".github/workflows/production-deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish and deploy. Defaults to git SHA."
        required: false
        type: string
      deploy:
        description: "Apply manifests and roll production deployments after pushing images."
        required: true
        default: false
        type: boolean
      run_platform_migration:
        description: "Authorize the production Platform migration job. Required for every production deploy."
        required: true
        default: false
        type: boolean
      run_rbac_seed:
        description: "Run DefaultRbacMenuSeeder after migration. Use when menus/permissions changed."
        required: true
        default: false
        type: boolean
      run_support_migration:
        description: "Migrate the isolated Support database. Run only after Support Postgres/Valkey and secrets are provisioned."
        required: true
        default: false
        type: boolean
      deploy_support:
        description: "Apply and roll the isolated Support services. Requires Support infrastructure and secrets."
        required: true
        default: false
        type: boolean

env:
  REGISTRY: registry.digitalocean.com/${{ secrets.DOCR_REGISTRY }}
  NAMESPACE: newpaotang-prod
  CLUSTER_NAME: ${{ secrets.DOKS_CLUSTER_NAME }}

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          IMAGE_TAG="${{ inputs.image_tag }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="${GITHUB_SHA::12}"
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "platform_api_image=${REGISTRY}/newpaotang-platform-api:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "support_api_image=${REGISTRY}/newpaotang-support-api:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "customer_image=${REGISTRY}/newpaotang-customer:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "back_office_image=${REGISTRY}/newpaotang-back-office:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "lotto_scraper_image=${REGISTRY}/newpaotang-lotto-scraper:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Stage frontend translation catalogs for API image
        run: |
          set -euo pipefail
          rm -rf apps/platform-api/resources/translation-locales
          mkdir -p apps/platform-api/resources/translation-locales/back-office
          mkdir -p apps/platform-api/resources/translation-locales/customer
          cp apps/back-office/locales/*.ts apps/platform-api/resources/translation-locales/back-office/
          cp apps/customer/locales/*.ts apps/platform-api/resources/translation-locales/customer/

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push platform API
        uses: docker/build-push-action@v6
        with:
          context: apps/platform-api
          file: apps/platform-api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.platform_api_image }}
          cache-from: type=gha,scope=platform-api
          cache-to: type=gha,scope=platform-api,mode=max

      - name: Build and push customer Flutter web
        uses: docker/build-push-action@v6
        with:
          context: apps/customer_flutter
          file: apps/customer_flutter/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.customer_image }}
          build-args: |
            API_BASE_URL=/api/v1
            APP_LOCALE=th-TH
          cache-from: type=gha,scope=customer-flutter-web
          cache-to: type=gha,scope=customer-flutter-web,mode=max

      - name: Build and push Support API
        uses: docker/build-push-action@v6
        with:
          context: apps/support-api
          file: apps/support-api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.support_api_image }}
          cache-from: type=gha,scope=support-api
          cache-to: type=gha,scope=support-api,mode=max

      - name: Build and push back office
        uses: docker/build-push-action@v6
        with:
          context: apps/back-office
          file: apps/back-office/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.back_office_image }}
          cache-from: type=gha,scope=back-office
          cache-to: type=gha,scope=back-office,mode=max

      - name: Build and push lotto scraper
        uses: docker/build-push-action@v6
        with:
          context: apps/lotto-scraper
          file: apps/lotto-scraper/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.lotto_scraper_image }}
          cache-from: type=gha,scope=lotto-scraper
          cache-to: type=gha,scope=lotto-scraper,mode=max

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.run_platform_migration }}
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Install kubectl credentials
        run: doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"

      - name: Validate production image outputs
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -z "$REGISTRY" ] || [ -z "$IMAGE_TAG" ]; then
            echo "::error::REGISTRY or IMAGE_TAG is empty."
            exit 1
          fi

          PLATFORM_API_IMAGE="${REGISTRY}/newpaotang-platform-api:${IMAGE_TAG}"
          SUPPORT_API_IMAGE="${REGISTRY}/newpaotang-support-api:${IMAGE_TAG}"
          CUSTOMER_IMAGE="${REGISTRY}/newpaotang-customer:${IMAGE_TAG}"
          BACK_OFFICE_IMAGE="${REGISTRY}/newpaotang-back-office:${IMAGE_TAG}"
          LOTTO_SCRAPER_IMAGE="${REGISTRY}/newpaotang-lotto-scraper:${IMAGE_TAG}"

          for image in "$PLATFORM_API_IMAGE" "$SUPPORT_API_IMAGE" "$CUSTOMER_IMAGE" "$BACK_OFFICE_IMAGE" "$LOTTO_SCRAPER_IMAGE"; do
            if [ -z "$image" ]; then
              echo "::error::Build job produced an empty image output."
              exit 1
            fi

            case "$image" in
              registry.digitalocean.com/*:*) ;;
              *)
                echo "::error::Invalid production image output: $image"
                exit 1
                ;;
            esac
          done

      - name: Render production manifests
        env:
          DOCR_REGISTRY: ${{ secrets.DOCR_REGISTRY }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DEPLOY_SUPPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_support }}
        run: |
          set -euo pipefail
          if [ -z "$DOCR_REGISTRY" ] || [ -z "$IMAGE_TAG" ]; then
            echo "::error::DOCR_REGISTRY or IMAGE_TAG is empty."
            exit 1
          fi

          rm -rf /tmp/newpaotang-deploy
          mkdir -p /tmp/newpaotang-deploy
          cp -R deploy/digitalocean /tmp/newpaotang-deploy/digitalocean
          cp -R deploy/digitalocean-support /tmp/newpaotang-deploy/digitalocean-support
          KUSTOMIZE_DIR=/tmp/newpaotang-deploy/digitalocean
          if [ "$DEPLOY_SUPPORT" = "true" ]; then
            KUSTOMIZE_DIR=/tmp/newpaotang-deploy/digitalocean-support
          fi
          find /tmp/newpaotang-deploy -name kustomization.yaml -exec \
            perl -0pi -e 's/REPLACE_WITH_REGISTRY/$ENV{DOCR_REGISTRY}/g; s/REPLACE_WITH_TAG/$ENV{IMAGE_TAG}/g' {} +
          kubectl kustomize "$KUSTOMIZE_DIR" > /tmp/newpaotang-rendered.yaml

          if grep -q 'REPLACE_WITH_REGISTRY\|REPLACE_WITH_TAG' /tmp/newpaotang-rendered.yaml; then
            echo "::error::Rendered manifests still contain placeholder image values."
            exit 1
          fi

          RENDERED_RESOURCES="$(kubectl apply --dry-run=client -f /tmp/newpaotang-rendered.yaml -o name)"
          if [ "$DEPLOY_SUPPORT" != "true" ] && grep -Eq 'support-api|support-realtime' <<<"$RENDERED_RESOURCES"; then
            echo "::error::Support resources leaked into the base production manifest."
            exit 1
          fi
          if [ "$DEPLOY_SUPPORT" = "true" ] && ! grep -qx 'deployment.apps/support-api' <<<"$RENDERED_RESOURCES"; then
            echo "::error::Support deployment is missing from the Support overlay."
            exit 1
          fi

      - name: Apply base manifests
        run: kubectl apply -f /tmp/newpaotang-rendered.yaml

      - name: Set production images
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          PLATFORM_API_IMAGE="${REGISTRY}/newpaotang-platform-api:${IMAGE_TAG}"
          CUSTOMER_IMAGE="${REGISTRY}/newpaotang-customer:${IMAGE_TAG}"
          BACK_OFFICE_IMAGE="${REGISTRY}/newpaotang-back-office:${IMAGE_TAG}"
          LOTTO_SCRAPER_IMAGE="${REGISTRY}/newpaotang-lotto-scraper:${IMAGE_TAG}"

          kubectl -n "$NAMESPACE" set image deployment/platform-api platform-api="$PLATFORM_API_IMAGE"
          kubectl -n "$NAMESPACE" set image deployment/platform-api-worker-critical worker="$PLATFORM_API_IMAGE"
          kubectl -n "$NAMESPACE" set image deployment/platform-api-worker-default worker="$PLATFORM_API_IMAGE"
          kubectl -n "$NAMESPACE" set image deployment/platform-api-worker-image worker="$PLATFORM_API_IMAGE"
          kubectl -n "$NAMESPACE" set image deployment/platform-api-scheduler scheduler="$PLATFORM_API_IMAGE"
          kubectl -n "$NAMESPACE" set image deployment/platform-api-reverb reverb="$PLATFORM_API_IMAGE"
          kubectl -n "$NAMESPACE" set image deployment/customer customer="$CUSTOMER_IMAGE"
          kubectl -n "$NAMESPACE" set image deployment/back-office back-office="$BACK_OFFICE_IMAGE"
          kubectl -n "$NAMESPACE" set image deployment/lotto-scraper-sanook lotto-scraper="$LOTTO_SCRAPER_IMAGE"
          kubectl -n "$NAMESPACE" set image deployment/lotto-scraper-thairath lotto-scraper="$LOTTO_SCRAPER_IMAGE"

      - name: Set isolated Support images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_support }}
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          SUPPORT_API_IMAGE="${REGISTRY}/newpaotang-support-api:${IMAGE_TAG}"
          kubectl -n "$NAMESPACE" set image deployment/support-api support-api="$SUPPORT_API_IMAGE"
          kubectl -n "$NAMESPACE" set image deployment/support-api-worker worker="$SUPPORT_API_IMAGE"
          kubectl -n "$NAMESPACE" set image deployment/support-api-scheduler scheduler="$SUPPORT_API_IMAGE"
          kubectl -n "$NAMESPACE" set image deployment/support-api-reverb reverb="$SUPPORT_API_IMAGE"

      - name: Run database migrations
        env:
          MIGRATION_JOB_NAME: newpaotang-migrate-${{ github.run_id }}-${{ github.run_attempt }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          PLATFORM_API_IMAGE="${REGISTRY}/newpaotang-platform-api:${IMAGE_TAG}"
          export PLATFORM_API_IMAGE
          envsubst < deploy/digitalocean/jobs/migrate.yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" wait --for=condition=complete "job/${MIGRATION_JOB_NAME}" --timeout=600s

      - name: Sync static translations
        env:
          TRANSLATION_SYNC_JOB_NAME: newpaotang-translation-sync-${{ github.run_id }}-${{ github.run_attempt }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          PLATFORM_API_IMAGE="${REGISTRY}/newpaotang-platform-api:${IMAGE_TAG}"
          export PLATFORM_API_IMAGE
          envsubst < deploy/digitalocean/jobs/translation-sync.yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" wait --for=condition=complete "job/${TRANSLATION_SYNC_JOB_NAME}" --timeout=600s

      - name: Run isolated Support database migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_support && inputs.run_support_migration }}
        env:
          SUPPORT_MIGRATION_JOB_NAME: newpaotang-support-migrate-${{ github.run_id }}-${{ github.run_attempt }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          SUPPORT_API_IMAGE="${REGISTRY}/newpaotang-support-api:${IMAGE_TAG}"
          export SUPPORT_API_IMAGE
          envsubst < deploy/digitalocean/jobs/support-migrate.yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" wait --for=condition=complete "job/${SUPPORT_MIGRATION_JOB_NAME}" --timeout=600s

      - name: Run RBAC/menu seed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_rbac_seed }}
        env:
          RBAC_SEED_JOB_NAME: newpaotang-rbac-seed-${{ github.run_id }}-${{ github.run_attempt }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          PLATFORM_API_IMAGE="${REGISTRY}/newpaotang-platform-api:${IMAGE_TAG}"
          export PLATFORM_API_IMAGE
          envsubst < deploy/digitalocean/jobs/rbac-seed.yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" wait --for=condition=complete "job/${RBAC_SEED_JOB_NAME}" --timeout=600s

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/platform-api --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/customer --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/back-office --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/platform-api-reverb --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/platform-api-worker-critical --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/platform-api-worker-default --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/platform-api-worker-image --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/platform-api-scheduler --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/lotto-scraper-sanook --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/lotto-scraper-thairath --timeout=600s

      - name: Verify Platform image parity
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          EXPECTED_IMAGE="${REGISTRY}/newpaotang-platform-api:${IMAGE_TAG}"

          while IFS=: read -r deployment container; do
            ACTUAL_IMAGE="$(kubectl -n "$NAMESPACE" get deployment "$deployment" -o "jsonpath={.spec.template.spec.containers[?(@.name=='$container')].image}")"
            if [ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]; then
              echo "::error::${deployment}/${container} uses ${ACTUAL_IMAGE}; expected ${EXPECTED_IMAGE}."
              exit 1
            fi
          done <<'DEPLOYMENTS'
          platform-api:platform-api
          platform-api-worker-critical:worker
          platform-api-worker-default:worker
          platform-api-worker-image:worker
          platform-api-scheduler:scheduler
          platform-api-reverb:reverb
          DEPLOYMENTS

      - name: Wait for isolated Support rollout
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_support }}
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/support-api --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/support-api-worker --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/support-api-scheduler --timeout=600s
          kubectl -n "$NAMESPACE" rollout status deployment/support-api-reverb --timeout=600s

      - name: Smoke production endpoints
        run: |
          curl -fsS https://api.siamblend.com/api/v1/health/ready
          curl -fsS https://api.siamblend.com/api/v1/health/live
          curl -fsSI https://siamblend.com/
          curl -fsSI https://admin.siamblend.com/

      - name: Smoke isolated Support endpoints
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_support }}
        run: |
          curl -fsS https://api.siamblend.com/support-api/health/ready
          curl -fsS https://api.siamblend.com/support-api/health/live

      - name: Show rollout diagnostics
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -80
