map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Docker service IPs can change when app containers are recreated. Resolve them
# through Docker DNS at request time so the local proxy does not keep stale IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name central.localhost;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /api/v1 {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 80;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $newpaotang_platform_api platform-api:8000;
        proxy_pass http://$newpaotang_platform_api;
    }

    location /lotto-scraper/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 80;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $newpaotang_lotto_scraper lotto-scraper:3200;
        rewrite ^/lotto-scraper/?(.*)$ /$1 break;
        proxy_pass http://$newpaotang_lotto_scraper;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 80;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        set $newpaotang_back_office back-office:3100;
        proxy_pass http://$newpaotang_back_office;
    }
}

