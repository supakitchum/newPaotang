map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream newpaotang_customer {
    server customer:3000;
}

upstream newpaotang_back_office {
    server back-office:3100;
}

upstream newpaotang_platform_api {
    server platform-api:8000;
}

server {
    listen 80;
    server_name central.localhost;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /api/v1 {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 80;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://newpaotang_platform_api;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 80;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://newpaotang_back_office;
    }
}

