          enum: [stock_partner_distributions]
        stock_mode:
          type: string
          enum: [virtual]
        allocation_id:
          type: string
          nullable: true
          description: Latest matching partner_stock_allocations snapshot id when available.
        partner_id:
          type: string
        tenant_id:
          type: string
          nullable: true
        game_id:
          type: string
        status:
          type: string
          enum: [active, allocated, partially_allocated, recalled, cancelled, inactive, archived]
        allocation_percent:
          type: number
        allocation_percent_basis_points:
          type: integer
          minimum: 0
        generated_supply_count:
          type: integer
          minimum: 0
        allocated_count:
          type: integer
          minimum: 0
        remaining_count:
          type: integer
          minimum: 0
        used_count:
          type: integer
          minimum: 0
        recalled_count:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
          nullable: true
    EventBatchRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [event_id, event_type, event_version, occurred_at, producer, idempotency_key, correlation_id, payload]
            properties:
              event_id:
                type: string
              event_type:
                type: string
              event_version:
                type: integer
              occurred_at:
                type: string
                format: date-time
              producer:
                type: string
                description: Module/service that produced the event, e.g. central_stock, partner_store, reward_engine.
              tenant_id:
                type: string
                nullable: true
                description: Required for tenant-local events; null only for central-only events.
              partner_id:
                type: string
                nullable: true
              game_id:
                type: string
                nullable: true
              idempotency_key:
                type: string
              correlation_id:
                type: string
                description: Request/job correlation id, usually X-Request-Id or generated job correlation id.
              payload:
                type: object
                additionalProperties: true
    EventBatchAccepted:
      type: object
      required: [accepted_count, duplicate_count]
      properties:
        accepted_count:
          type: integer
        duplicate_count:
          type: integer
    WebhookCallbackRequest:
      type: object
      properties:
        id:
          type: string
          nullable: true
        event:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
      additionalProperties: true
    WebhookCallbackAccepted:
      type: object
      required: [accepted, duplicate]
      properties:
        accepted:
          type: boolean
        duplicate:
          type: boolean
        correlation_id:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
