      security: []
      summary: Receive payment provider callback
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: X-Signature
          in: header
          required: false
          schema:
            type: string
            pattern: '^sha256=[a-fA-F0-9]{64}$'
          description: HMAC SHA-256 signature over `{X-Webhook-Timestamp}.{raw request body}` when the tenant connection uses hmac_sha256.
        - name: X-Webhook-Timestamp
          in: header
          required: false
          schema:
            type: integer
          description: Unix timestamp required by hmac_sha256 authentication and rejected outside the configured replay window.
        - name: X-Webhook-Token
          in: header
          required: false
          schema:
            type: string
          description: Static secret required when the tenant connection uses token authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCallbackRequest"
          application/x-www-form-urlencoded:
