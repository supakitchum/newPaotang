      summary: Request support impersonation access
      parameters:
        - $ref: "#/components/parameters/TenantAdminScopeHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportAccessRequest"
      responses:
        "201":
          description: Support access request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /admin/tenant/support-access/{support_access_id}:
    get:
      tags: [Tenant Admin]
      summary: View tenant support access request and audit trail
      parameters:
        - $ref: "#/components/parameters/TenantAdminScopeHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: support_access_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant support access request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/tenant/support-access/{support_access_id}/approve:
    post:
      tags: [Tenant Admin]
      summary: Approve tenant support access request
      parameters:
        - $ref: "#/components/parameters/TenantAdminScopeHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: support_access_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: Tenant support access request approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessRequest"
        "409":
          $ref: "#/components/responses/ResourceConflict"
  /admin/tenant/support-access/{support_access_id}/revoke:
    post:
      tags: [Tenant Admin]
      summary: Revoke tenant support access request or active session
      parameters:
        - $ref: "#/components/parameters/TenantAdminScopeHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: support_access_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: Tenant support access revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessRequest"
        "409":
          $ref: "#/components/responses/ResourceConflict"
  /admin/tenant/support-access/{support_access_id}/impersonate:
    post:
      tags: [Tenant Admin]
      summary: Start approved support impersonation session
      parameters:
        - $ref: "#/components/parameters/TenantAdminScopeHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: support_access_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: Support impersonation session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ResourceConflict"
  /admin/tenant/support-access/{support_access_id}/elevated-actions:
    post:
      tags: [Tenant Admin]
      summary: Request or record an elevated action during support access
      parameters:
        - $ref: "#/components/parameters/TenantAdminScopeHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: support_access_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "202":
          description: Support elevated action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ResourceConflict"
  /admin/tenant/support-access/{support_access_id}/end-session:
    post:
      tags: [Tenant Admin]
      summary: End active support impersonation session
      parameters:
        - $ref: "#/components/parameters/TenantAdminScopeHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: support_access_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: Support impersonation session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ResourceConflict"

  /partner-sync/allocations:
    get:
      tags: [Partner Sync]
      summary: Pull virtual allocation distribution rows by cursor
      description: Returns virtual allocation/distribution metadata from stock_partner_distributions and partner_stock_allocations. New active flow no longer streams physical partner_stock_allocation_items as the source of truth.
      parameters:
        - $ref: "#/components/parameters/PartnerIdHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20000
            default: 5000
      responses:
        "200":
          description: Allocation chunk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationPullResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /partner-sync/events:
    post:
      tags: [Partner Sync]
      summary: Submit partner event batch to central inbox
      parameters:
        - $ref: "#/components/parameters/PartnerIdHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatchRequest"
      responses:
        "202":
          description: Batch accepted into inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBatchAccepted"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /webhooks/payments/{provider}:
    post:
      tags: [Webhooks]
      security: []
      summary: Receive payment provider callback
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: X-Signature
          in: header
          required: false
          schema:
            type: string
          description: Provider-specific callback signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCallbackRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WebhookCallbackRequest"
      responses:
        "202":
          description: Payment callback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookCallbackAccepted"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "409":
          $ref: "#/components/responses/ResourceConflict"
  /webhooks/topups/{provider}:
    post:
      tags: [Webhooks]
      security: []
      summary: Receive topup/payment provider callback
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: X-Signature
          in: header
          required: false
          schema:
            type: string
          description: Provider-specific callback signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCallbackRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WebhookCallbackRequest"
      responses:
        "202":
          description: Topup callback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookCallbackAccepted"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "409":
          $ref: "#/components/responses/ResourceConflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Customer, admin, partner API, service worker, or support impersonation token depending on endpoint audience.
  parameters:
    TenantHostHeader:
      name: Host
      in: header
      required: true
      description: Tenant public domain used by backend tenant resolution.
      schema:
        type: string
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CentralAdminScopeHeader:
      name: X-Admin-Scope
      in: header
      required: true
      description: Must be central for central admin endpoints.
      schema:
        type: string
        enum: [central]
    TenantAdminScopeHeader:
      name: X-Admin-Scope
      in: header
      required: true
      description: Must be tenant for tenant admin endpoints.
      schema:
        type: string
        enum: [tenant]
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
    PartnerIdHeader:
      name: X-Partner-Id
      in: header
      required: true
      schema:
        type: string
  responses:
    AuthenticationRequired:
      description: Authentication token is missing, invalid, expired, or revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PermissionDenied:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: Idempotency key was already used with a different payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TenantNotFound:
      description: Tenant/domain not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DomainNotActive:
      description: Tenant domain exists but is not active, verified, or ready for public traffic
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResourceConflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MaintenanceActive:
      description: Tenant maintenance is active
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service unavailable or overloaded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
        currency:
          type: string
          example: THB
    DashboardSummary:
      type: object
      required: [scope, generated_at, kpis]
      properties:
        scope:
          type: string
          enum: [central, tenant]
        tenant_id:
          type: string
          nullable: true
        generated_at:
          type: string
          format: date-time
        kpis:
          type: object
          additionalProperties: true
        charts:
          type: object
          additionalProperties: true
        alerts:
          type: array
          items:
            type: object
            additionalProperties: true
    AdminResourceListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminResource"
        meta:
          $ref: "#/components/schemas/CursorMeta"
    AdminResource:
      type: object
      required: [id]
      properties:
        id:
          type: string
        tenant_id:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true
    AdminCreateRequest:
      type: object
      additionalProperties: true
    StockGenerationBatchListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StockGenerationBatchResponse"
        meta:
          $ref: "#/components/schemas/CursorMeta"
    StockGenerationBatchResponse:
      type: object
      required:
        - id
        - status
        - game_id
        - type
        - requested_count
        - generated_count
        - total_rounds
        - processed_rounds
        - chunk_rounds
        - started_at
        - completed_at
        - failed_at
        - failure_reason
      properties:
        id:
          type: string
        tenant_id:
          type: string
          nullable: true
        status:
          type: string
          enum: [queued, pending, processing, completed, failed, cancelled]
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        game_id:
          type: string
        type:
          type: string
          enum: [virtual_profile, import, export]
        requested_count:
          type: integer
          minimum: 0
        generated_count:
          type: integer
          minimum: 0
        total_rounds:
          type: integer
          minimum: 0
        processed_rounds:
          type: integer
          minimum: 0
        chunk_rounds:
          type: integer
          minimum: 0
        range_start:
          type: string
          nullable: true
        range_end:
          type: string
          nullable: true
        number_digits:
          type: integer
          nullable: true
        stock_mode:
          type: string
          enum: [virtual]
          nullable: true
        profile_id:
          type: string
          nullable: true
        layer_id:
          type: string
          nullable: true
        layer_capacity:
          type: integer
          minimum: 0
          nullable: true
        total_capacity:
          type: integer
          minimum: 0
          nullable: true
        top_up:
          type: boolean
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true
        failure_reason:
          type: string
          nullable: true
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/StockGenerationBatchChunk"
      additionalProperties: true
    StockGenerationBatchChunk:
      type: object
      required:
        - id
        - batch_id
        - chunk_index
        - start_round
        - round_count
        - status
        - attempt_count
      properties:
        id:
          type: string
        batch_id:
          type: string
        chunk_index:
          type: integer
          minimum: 0
        start_round:
          type: integer
          minimum: 0
        round_count:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [queued, processing, completed, failed]
        attempt_count:
          type: integer
          minimum: 0
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true
        failure_reason:
          type: string
          nullable: true
      additionalProperties: true
    StockSummaryResponse:
      type: object
      required:
        - game_id
        - batch_id
        - total_count
        - status_counts
        - number_coverage
        - empty
      properties:
        game_id:
          type: string
          nullable: true
        batch_id:
          type: string
          nullable: true
        total_count:
          type: integer
          minimum: 0
        status_counts:
          $ref: "#/components/schemas/StockSummaryStatusCounts"
        number_coverage:
          type: object
          required:
            - back2
            - back3
            - front3
          properties:
            back2:
              $ref: "#/components/schemas/StockNumberCoverage"
            back3:
              $ref: "#/components/schemas/StockNumberCoverage"
            front3:
              $ref: "#/components/schemas/StockNumberCoverage"
        empty:
          type: boolean
          description: True when the filtered summary has no stock rows.
      additionalProperties: true
    StockSummaryStatusCounts:
      type: object
      required:
        - available
        - allocated
        - sold
        - recalled
        - voided
        - total
      properties:
        available:
          type: integer
          minimum: 0
        allocated:
          type: integer
          minimum: 0
        sold:
          type: integer
          minimum: 0
        recalled:
          type: integer
          minimum: 0
        voided:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
      additionalProperties: true
    StockNumberCoverage:
      type: object
      required:
        - expected_distinct
        - distinct_count
        - missing_distinct_count
        - min_count_per_number
        - max_count_per_number
        - total_count
      properties:
        expected_distinct:
          type: integer
          minimum: 0
          description: Expected number of distinct lottery fragments for the dimension.
        distinct_count:
          type: integer
          minimum: 0
        missing_distinct_count:
          type: integer
          minimum: 0
        min_count_per_number:
          type: integer
          minimum: 0
          description: Zero when at least one expected fragment is missing.
        max_count_per_number:
          type: integer
          minimum: 0
        total_count:
          type: integer
          minimum: 0
      additionalProperties: true
    StockGenerateRequest:
      type: object
      required:
        - game_id
        - generation_mode
      description: Virtual stock generate/top-up settings. The first request creates the active profile/container; later requests add supply layers. Seed and layer seed are generated internally. Legacy physical fields such as total_count, back2_count_per_number, start_number, count, and number_digits are rejected.
      properties:
        game_id:
          type: string
          description: Open central game ID.
        generation_mode:
          type: string
          enum: [virtual_profile]
          description: Must be virtual_profile.
        set_distribution:
          type: array
          description: Capacity distribution over the seeded base lottery numbers. Remaining percent defaults to single-ticket capacity.
          items:
            $ref: "#/components/schemas/StockSetDistributionRow"
        partner_distribution:
          type: array
          description: Optional initial partner allocation percent rows. Active allocation source-of-truth is stock_partner_distributions; partner_quotas are not used for new visibility/allocation.
          items:
            type: object
            required: [partner_id, percent]
            properties:
              partner_id:
                type: string
              percent:
                type: number
                minimum: 0
                maximum: 100
        central_limits:
          type: object
          additionalProperties: false
          properties:
            back2_limit: { type: integer, minimum: 0 }
            back3_limit: { type: integer, minimum: 0 }
            front3_limit: { type: integer, minimum: 0 }
        partner_limits:
          type: array
          items:
            type: object
            required: [partner_id]
            properties:
              partner_id: { type: string }
              back2_limit: { type: integer, minimum: 0 }
              back3_limit: { type: integer, minimum: 0 }
              front3_limit: { type: integer, minimum: 0 }
        reason:
          type: string
    StockSettingsRequest:
      type: object
      properties:
        settings:
          type: object
          properties:
            stock_set_distribution_default:
              type: array
              items:
                $ref: "#/components/schemas/StockSetDistributionRow"
            stock_pattern_coverage_default:
              $ref: "#/components/schemas/StockPatternCoverageDefault"
    StockSettingsResponse:
      type: object
      properties:
        id:
          type: string
          example: stock_settings
        status:
          type: string
          example: active
        settings:
          type: object
          properties:
            stock_set_distribution_default:
              type: array
              items:
                $ref: "#/components/schemas/StockSetDistributionRow"
            stock_pattern_coverage_default:
              $ref: "#/components/schemas/StockPatternCoverageDefault"
        stock_set_distribution_default:
          type: array
          items:
            $ref: "#/components/schemas/StockSetDistributionRow"
        stock_pattern_coverage_default:
          $ref: "#/components/schemas/StockPatternCoverageDefault"
    StockSetDistributionRow:
      type: object
      required: [set_size, percent]
      properties:
        set_size:
          type: integer
          minimum: 1
          maximum: 99
        percent:
          type: number
          minimum: 0
          maximum: 100
          description: Optional audited admin action reason.
      additionalProperties: false
    StockPatternCoverageDefault:
      type: object
      required: [central, partner]
      properties:
        central:
          $ref: "#/components/schemas/StockPatternCoverageLimitRow"
        partner:
          $ref: "#/components/schemas/StockPatternCoverageLimitRow"
      additionalProperties: false
    StockPatternCoverageLimitRow:
      type: object
      required: [back2_limit, back3_limit, front3_limit]
      properties:
        back2_limit:
          type: integer
          minimum: 0
        back3_limit:
          type: integer
          minimum: 0
        front3_limit:
          type: integer
          minimum: 0
      additionalProperties: false
    StockLimitSettingsRequest:
      type: object
      required: [game_id, scope_type, scope_id]
      properties:
        game_id:
          type: string
        scope_type:
          type: string
          enum: [central, partner]
        scope_id:
          type: string
        back2_limit:
          type: integer
          minimum: 0
          nullable: true
        back3_limit:
          type: integer
          minimum: 0
          nullable: true
        front3_limit:
          type: integer
          minimum: 0
          nullable: true
      additionalProperties: false
    StockLimitOverridesRequest:
      type: object
      required: [game_id, scope_type, scope_id, dimension, overrides]
      properties:
        game_id:
          type: string
        scope_type:
          type: string
          enum: [central, partner]
