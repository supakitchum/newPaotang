      type: object
      required: [id, tenant_id, name, phone, status, created_at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
          description: Tenant ownership boundary. Backend must never return members from another tenant.
        member_no:
          type: string
          nullable: true
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        status:
          type: string
          enum: [active, pending_verification, suspended, disabled]
        wallets:
          type: array
          items:
            $ref: "#/components/schemas/Wallet"
        order_count:
          type: integer
        lifetime_spend:
          $ref: "#/components/schemas/Money"
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTenantMemberRequest:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        password:
          type: string
          format: password
          nullable: true
        status:
          type: string
          enum: [active, pending_verification, suspended, disabled]
          default: active
        send_invitation:
          type: boolean
          default: false
    UpdateTenantMemberRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        admin_note:
          type: string
          nullable: true
    UpdateTenantMemberStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [active, pending_verification, suspended, disabled]
        reason:
          type: string
          description: Required for audit log.
        notify_member:
          type: boolean
          default: true
    AdminOrderListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrderSummary"
        meta:
          $ref: "#/components/schemas/CursorMeta"
    AdminOrderSummary:
      type: object
      required: [id, tenant_id, status, payment_status, total, ticket_count, created_at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        reference:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, pending_payment, paid, cancelled, expired, refunded, failed]
        payment_status:
          type: string
          enum: [unpaid, pending, paid, refunded, failed]
        total:
          $ref: "#/components/schemas/Money"
        ticket_count:
          type: integer
        customer:
          $ref: "#/components/schemas/CustomerProfile"
        store:
          $ref: "#/components/schemas/Store"
        game_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true
    AdminOrderDetail:
      allOf:
        - $ref: "#/components/schemas/AdminOrderSummary"
        - type: object
          properties:
            tickets:
              type: array
              items:
                $ref: "#/components/schemas/Ticket"
            wallet:
              $ref: "#/components/schemas/Wallet"
            payment:
              type: object
              additionalProperties: true
            admin_note:
              type: string
              nullable: true
            audit:
              type: array
              items:
                type: object
                additionalProperties: true
    UpdateAdminOrderRequest:
      type: object
      required: [reason]
      properties:
        status:
          type: string
          enum: [pending_payment, paid, cancelled, expired, refunded, failed]
        payment_status:
          type: string
          enum: [unpaid, pending, paid, refunded, failed]
        admin_note:
          type: string
        reason:
          type: string
          description: Required for audit log.
    CancelAdminOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        refund_policy:
          type: string
          enum: [none, wallet_refund, manual_refund]
          default: none
        notify_customer:
          type: boolean
          default: true
    RefundAdminOrderRequest:
      type: object
      required: [amount, reason]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        method:
          type: string
          enum: [wallet_refund, manual_refund, original_payment]
          default: wallet_refund
        reason:
          type: string
          description: Required for audit log.
        notify_customer:
          type: boolean
          default: true
    ReportResponse:
      type: object
      required: [report_key, scope, generated_at, summary, rows, meta]
      properties:
        report_key:
          type: string
        scope:
          type: string
          enum: [central, tenant]
        tenant_id:
          type: string
          nullable: true
          description: Null for all-system central reports; set for tenant reports or central tenant drill-down.
        generated_at:
          type: string
          format: date-time
        summary:
          type: object
          additionalProperties: true
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          $ref: "#/components/schemas/CursorMeta"
    CreateReportExportRequest:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [csv, xlsx, pdf]
        tenant_id:
          type: string
          nullable: true
          description: Central exports may set this for tenant drill-down. Tenant exports ignore this value.
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        filters:
          type: object
          additionalProperties: true
    ExportJob:
      type: object
      required: [id, source, scope, format, status, created_at]
      properties:
        id:
          type: string
        source:
          type: string
          enum: [report, stock, audit, settlement, other]
        report_key:
          type: string
          nullable: true
        scope:
          type: string
          enum: [central, tenant]
        tenant_id:
          type: string
          nullable: true
        format:
          type: string
          enum: [csv, xlsx, pdf, zip]
        status:
          type: string
          enum: [queued, processing, ready, failed, expired]
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        download_url:
          type: string
          format: uri
          nullable: true
        error_code:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
    ReportExportJob:
      type: object
      required: [id, report_key, scope, format, status, created_at]
      properties:
        id:
          type: string
        report_key:
          type: string
        scope:
          type: string
          enum: [central, tenant]
        tenant_id:
          type: string
          nullable: true
        format:
          type: string
          enum: [csv, xlsx, pdf]
        status:
          type: string
          enum: [queued, processing, ready, failed, expired]
        download_url:
          type: string
          format: uri
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    AllocationPullResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AllocationPullItem"
        meta:
          $ref: "#/components/schemas/CursorMeta"
    AllocationPullItem:
      type: object
      required:
        - id
        - source
        - stock_mode
        - partner_id
        - tenant_id
        - game_id
        - status
        - allocation_percent
        - allocation_percent_basis_points
        - generated_supply_count
        - allocated_count
        - remaining_count
      properties:
        id:
          type: string
          description: Cursor source id from stock_partner_distributions.
        source:
          type: string
          enum: [stock_partner_distributions]
        stock_mode:
          type: string
          enum: [virtual]
        allocation_id:
          type: string
          nullable: true
          description: Latest matching partner_stock_allocations snapshot id when available.
        partner_id:
          type: string
        tenant_id:
          type: string
          nullable: true
        game_id:
          type: string
        status:
          type: string
          enum: [active, allocated, partially_allocated, recalled, cancelled, inactive, archived]
        allocation_percent:
          type: number
        allocation_percent_basis_points:
          type: integer
          minimum: 0
        generated_supply_count:
          type: integer
          minimum: 0
        allocated_count:
          type: integer
          minimum: 0
        remaining_count:
          type: integer
          minimum: 0
        used_count:
          type: integer
          minimum: 0
        recalled_count:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
          nullable: true
    EventBatchRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [event_id, event_type, event_version, occurred_at, producer, idempotency_key, correlation_id, payload]
            properties:
              event_id:
                type: string
              event_type:
                type: string
              event_version:
                type: integer
              occurred_at:
                type: string
                format: date-time
              producer:
                type: string
                description: Module/service that produced the event, e.g. central_stock, partner_store, reward_engine.
              tenant_id:
                type: string
                nullable: true
                description: Required for tenant-local events; null only for central-only events.
              partner_id:
                type: string
                nullable: true
              game_id:
                type: string
                nullable: true
              idempotency_key:
                type: string
              correlation_id:
                type: string
                description: Request/job correlation id, usually X-Request-Id or generated job correlation id.
              payload:
                type: object
                additionalProperties: true
    EventBatchAccepted:
      type: object
      required: [accepted_count, duplicate_count]
      properties:
        accepted_count:
          type: integer
        duplicate_count:
          type: integer
    WebhookCallbackRequest:
      type: object
      properties:
        id:
          type: string
          nullable: true
        event:
          type: string
          nullable: true
        reference:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
      additionalProperties: true
    WebhookCallbackAccepted:
      type: object
      required: [accepted, duplicate]
      properties:
        accepted:
          type: boolean
        duplicate:
          type: boolean
        correlation_id:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
