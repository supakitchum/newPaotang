components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Customer, admin, partner API, service worker, or support impersonation token depending on endpoint audience.
  parameters:
    TenantHostHeader:
      name: Host
      in: header
      required: true
      description: Tenant public domain used by backend tenant resolution.
      schema:
        type: string
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    RewardRiskFindingId:
      name: finding_id
      in: path
      required: true
      schema:
        type: string
    RewardRiskTenantFilter:
      name: tenant_id
      in: query
      required: false
      schema:
        type: string
    RewardRiskGameFilter:
      name: game_id
      in: query
      required: false
      schema:
        type: string
    RewardRiskPhaseFilter:
      name: phase
      in: query
      required: false
      schema:
        type: string
        enum: [provisional, final]
    RewardRiskPrizeTypeFilter:
      name: prize_type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/RewardRiskPrizeType"
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CentralAdminScopeHeader:
      name: X-Admin-Scope
      in: header
      required: true
      description: Must be central for central admin endpoints.
      schema:
        type: string
        enum: [central]
    TenantAdminScopeHeader:
      name: X-Admin-Scope
      in: header
      required: true
      description: Must be tenant for tenant admin endpoints.
      schema:
        type: string
        enum: [tenant]
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
    PartnerIdHeader:
      name: X-Partner-Id
      in: header
      required: true
      schema:
        type: string
    SocialProviderPath:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [line, google, apple, facebook]
    ActivityIdPath:
      name: activity_id
      in: path
      required: true
      schema:
        type: string
  responses:
    AuthenticationRequired:
      description: Authentication token is missing, invalid, expired, or revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PermissionDenied:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: Idempotency key was already used with a different payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TenantNotFound:
      description: Tenant/domain not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DomainNotActive:
      description: Tenant domain exists but is not active, verified, or ready for public traffic
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResourceConflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MaintenanceActive:
      description: Tenant maintenance is active
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service unavailable or overloaded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RewardRiskPrizeType:
      type: string
      enum: [first_prize, near_first_prize, second_prize, third_prize, fourth_prize, fifth_prize, front3, back3, back2]
    RewardRiskSettingsInput:
      type: object
      required: [enabled, monitored_prize_types, threshold_multiplier]
      properties:
        enabled:
          type: boolean
        monitored_prize_types:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RewardRiskPrizeType"
        threshold_multiplier:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
          examples: ["1.00"]
    RewardRiskSettings:
      allOf:
        - $ref: "#/components/schemas/RewardRiskSettingsInput"
        - type: object
          required: [tenant_id, version]
          properties:
            tenant_id:
              type: string
            version:
              type: integer
            updated_at:
              type: [string, "null"]
              format: date-time
    RewardRiskRun:
      type: object
      required: [id, tenant_id, game_id, phase, reward_version, status, is_current, evaluated_group_count, finding_count, total_purchase_amount, total_prize_amount, currency]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        tenant_name: { type: [string, "null"] }
        partner_name: { type: [string, "null"] }
        game_id: { type: string }
        game_name: { type: [string, "null"] }
        reward_result_id: { type: string }
        phase: { type: string, enum: [provisional, final] }
        reward_version: { type: integer }
