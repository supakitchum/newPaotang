      type: object
      required: [game_id, version, set_type, zip]
      properties:
        game_id:
          type: string
        version:
          type: string
          example: v1
        set_type:
          type: string
          enum: [odd, even, charity]
        expected_count:
          type: integer
          minimum: 1
          deprecated: true
          description: Deprecated and ignored. The API detects the image count from readable root-level zip image entries automatically.
        status:
          type: string
          enum: [ready, inactive, retired]
          default: ready
        supersede_existing:
          type: boolean
          default: false
        zip:
          type: string
          format: binary
          description: Root-level image-only zip. Source filenames may be custom; the API naturally sorts image filenames and normalizes stored sources to 001.ext, 002.ext, and so on using the detected source extension. Supported source image extensions are png, jpg, jpeg, and webp. Maximum upload size follows the running PHP upload_max_filesize and post_max_size limits; the project Docker runtime sets lottery background uploads to 500M with post_max_size overhead.
