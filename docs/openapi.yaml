openapi: 3.1.0
info:
  title: NewPaotang Platform API
  version: 0.1.0
  description: Backend API contract skeleton for the NewPaotang modular platform.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Public Tenant
  - name: System Auth
  - name: Customer
  - name: Customer Auth
  - name: Central Admin
  - name: Tenant Admin
  - name: Realtime
  - name: Customer Support
  - name: Internal Support
  - name: Partner Sync
  - name: Webhooks
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Platform health summary
      responses:
        "200":
          description: Health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: Application process is live
  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Readiness probe
      responses:
        "200":
          description: Database and Redis/Valkey are ready
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /internal/customer-support/notifications:
    post:
      tags: [Internal Support]
      security: []
      summary: Accept a signed Support outbox event for Customer Notification and FCM delivery
      parameters:
        - name: X-Support-Signature
          in: header
          required: true
          schema:
            type: string
          description: Lowercase SHA-256 HMAC of the raw request body.
        - name: X-Support-Event-Id
          in: header
          required: true
          schema:
            type: string
          description: Stable delivery identifier used for notification deduplication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalSupportNotificationRequest"
      responses:
        "201":
          description: Customer notification accepted.
        "401":
          description: HMAC signature is invalid.
        "404":
          description: The target tenant/customer snapshot no longer exists in Platform.

  /public/site-config:
    get:
      tags: [Public Tenant]
      security: []
      summary: Resolve tenant site configuration by request host
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Tenant site configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteConfigResponse"
        "404":
          $ref: "#/components/responses/TenantNotFound"
        "409":
          $ref: "#/components/responses/DomainNotActive"
  /public/admin-site-config:
    get:
      tags: [Public Tenant]
      security: []
      summary: Resolve partner Back Office branding by bo.* request host
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Partner Back Office branding configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSiteConfigResponse"
        "404":
          $ref: "#/components/responses/TenantNotFound"
        "409":
          $ref: "#/components/responses/DomainNotActive"
  /public/mobile/bootstrap:
    get:
      tags: [Public Tenant]
      security: []
      summary: Resolve the runtime customer mobile and Web bootstrap
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Tenant site configuration plus customer runtime policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileBootstrapResponse"
        "404":
          $ref: "#/components/responses/TenantNotFound"
        "409":
          $ref: "#/components/responses/DomainNotActive"
  /.well-known/apple-app-site-association:
    get:
      tags: [Public Tenant]
      security: []
      servers:
        - url: /
      summary: Resolve Apple app and WebAuthn association for the tenant domain
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
      responses:
        "200":
          description: Apple App Site Association with applinks and webcredentials app IDs
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/TenantNotFound"
  /.well-known/assetlinks.json:
    get:
      tags: [Public Tenant]
      security: []
      servers:
        - url: /
      summary: Resolve Android Digital Asset Links for the tenant domain
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
      responses:
        "200":
          description: Android application package and release certificate associations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "404":
          $ref: "#/components/responses/TenantNotFound"
  /public/translations:
    get:
      tags: [Public Tenant]
      security: []
      summary: Load the active runtime translation bundle and locale catalog
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: locale
          in: query
          required: false
          schema:
            type: string
          description: Requested BCP 47 locale. X-Locale and Accept-Language are fallbacks.
        - name: surface
          in: query
          required: false
          schema:
            type: string
            enum: [customer, back-office, api]
            default: customer
        - name: preview_token
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Runtime translation messages and active locale options
          headers:
            Content-Language:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationBundle"
  /public/seo/page:
    get:
      tags: [Public Tenant]
      security: []
      summary: Tenant-aware SEO metadata for a public path
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SEO metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoMetadata"
        "404":
          $ref: "#/components/responses/TenantNotFound"
  /public/news:
    get:
      tags: [Public Tenant]
      security: []
      summary: Tenant public news/banner list for customer home
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Tenant public news items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsListResponse"
  /public/news/modal:
    get:
      tags: [Public Tenant]
      security: []
      summary: Load the current customer announcement modal
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Current announcement or an empty resource
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/NewsItem"
                  - type: object
                    maxProperties: 0
  /public/news/{slug}:
    get:
      tags: [Public Tenant]
      security: []
      summary: Load a published customer news article
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published news article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
        "404":
          $ref: "#/components/responses/NotFound"
  /public/activities:
    get:
      tags: [Public Tenant]
      security: []
      summary: List tenant customer activities
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: history
          in: query
          required: false
          schema:
            type: boolean
        - name: game_id
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Public activities ordered by tenant activity policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityListResponse"
  /public/activities/{slug}:
    get:
      tags: [Public Tenant]
      security: []
      summary: Load a public activity by slug
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public activity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          $ref: "#/components/responses/NotFound"
  /public/stores:
    get:
      tags: [Public Tenant]
      security: []
      summary: Search tenant seller/store list for customer store flow
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Tenant stores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreListResponse"
  /public/games/current:
    get:
      tags: [Public Tenant]
      security: []
      summary: Current tenant game for public buy flow
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Current game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/MaintenanceActive"

  /public/stock/search:
    get:
      tags: [Public Tenant]
      security: []
      summary: Search tenant-local stock
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: game_id
          in: query
          required: true
          schema:
            type: string
        - name: number
          in: query
          required: false
          schema:
            type: string
          description: Full or partial 6-digit search value. Empty value can request browse/random stock.
        - name: front3
          in: query
          required: false
          schema:
            type: string
          description: Optional explicit front-3 filter. Backend may derive this from number when possible.
        - name: back3
          in: query
          required: false
          schema:
            type: string
          description: Optional explicit back-3 filter. Backend may derive this from number when possible.
        - name: back2
          in: query
          required: false
          schema:
            type: string
          description: Optional explicit back-2 filter. Backend may derive this from number when possible.
        - name: store_id
          in: query
          required: false
          schema:
            type: string
          description: Optional seller/store filter for the existing customer store flow.
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [search, browse, random]
            default: search
          description: Supports existing customer browse/refresh/search UI without changing UI flow.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Search results from tenant-local stock only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalStockSearchResponse"
        "503":
          $ref: "#/components/responses/MaintenanceActive"
  /public/stock/images/{token}.webp:
    get:
      tags: [Public Tenant]
      security: []
      summary: Serve a tenant-scoped generated lottery image
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated WebP lottery image
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /public/assets/{path}:
    get:
      tags: [Public Tenant]
      security: []
      summary: Serve a committed tenant public asset
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Slash-containing public asset path.
      responses:
        "200":
          description: Public asset bytes with the stored content type
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /public/monitor/visit:
    post:
      tags: [Public Tenant]
      security: []
      summary: Upsert the current tenant-scoped public visit session
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicVisitRequest"
      responses:
        "200":
          description: Visit tracking result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVisitResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /public/affiliate/referrals/click:
    post:
      tags: [Public Tenant]
      security: []
      summary: Track a tenant affiliate referral click before authentication
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffiliateReferralClickRequest"
      responses:
        "200":
          description: Existing referral visit refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateReferralClickResponse"
        "201":
          description: Referral visit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffiliateReferralClickResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /auth/admin/login:
    post:
      tags: [System Auth]
      security: []
      summary: Login to back-office as central or tenant admin
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Admin auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/refresh:
    post:
      tags: [System Auth]
      security: []
      summary: Refresh admin access token
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Refreshed admin auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/logout:
    post:
      tags: [System Auth]
      summary: Revoke current admin session
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "204":
          description: Admin session revoked
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/me:
    get:
      tags: [System Auth]
      summary: Current admin profile, scopes, tenants, and permissions
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Current admin session profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionProfile"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/server-time:
    get:
      tags: [System Auth]
      summary: Current application server time for Back Office clock synchronization
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Current server time and configured application timezone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminServerTime"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/password/forgot:
    post:
      tags: [System Auth]
      security: []
      summary: Request admin password reset
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Password reset request accepted
  /auth/admin/password/reset:
    post:
      tags: [System Auth]
      security: []
      summary: Reset admin password with reset token
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Admin password reset
  /auth/admin/invitations/{token}:
    get:
      tags: [System Auth]
      security: []
      summary: Preview a pending one-time admin invitation
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInvitationPreviewResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/admin/invitations/{token}/accept:
    post:
      tags: [System Auth]
      security: []
      summary: Set the invited admin password and activate the account
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInvitationAcceptRequest"
      responses:
        "200":
          description: Admin invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInvitationAcceptedResponse"
        "409":
          $ref: "#/components/responses/ResourceConflict"
        "410":
          description: Invitation expired
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /auth/admin/password/change:
    post:
      tags: [System Auth]
      summary: Change current admin password
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Admin password changed
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/2fa:
    get:
      tags: [System Auth]
      summary: View admin two-factor status
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Admin two-factor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResource"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
    delete:
      tags: [System Auth]
      summary: Disable admin two-factor authentication
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "204":
          description: Admin two-factor disabled
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/2fa/setup:
    post:
      tags: [System Auth]
      summary: Start admin two-factor setup
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: Admin two-factor setup secret and recovery context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResource"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/2fa/enable:
    post:
      tags: [System Auth]
      summary: Enable admin two-factor authentication after setup verification
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: Admin two-factor enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResource"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "409":
          $ref: "#/components/responses/ResourceConflict"
  /auth/admin/2fa/recovery-codes:
    post:
      tags: [System Auth]
      summary: Rotate admin two-factor recovery codes
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: Admin recovery codes rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResource"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/2fa/verify:
    post:
      tags: [System Auth]
      security: []
      summary: Verify admin two-factor challenge
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTwoFactorVerifyRequest"
      responses:
        "200":
          description: Admin auth session after two-factor verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /admin/central/realtime/auth:
    post:
      tags: [Realtime]
      summary: Authorize central admin private realtime channel subscription
      description: >
        Authorizes central admin realtime channels. Stock generation progress channels are
        `private-admin.central.stock-generation`,
        `private-admin.central.stock-generation.game.{game_id}`, and
        `private-admin.central.stock-generation.batch.{batch_id}`. These stock generation
        channels require central scope and `stock.generate`. The central grouped stock table
        channel `private-admin.central.stock.table.game.{game_id}` requires central scope and
        `stock.view`.
      parameters:
        - $ref: "#/components/parameters/CentralAdminScopeHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeAuthRequest"
      responses:
        "200":
          description: Realtime channel authorization payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeAuthResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /customer/auth/register:
    post:
      tags: [Customer Auth]
      security: []
      summary: Register customer member under tenant host context
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRegisterRequest"
      responses:
        "201":
          description: Customer auth token
          content:
