openapi: 3.1.0
info:
  title: NewPaotang Platform API
  version: 0.1.0
  description: Backend API contract skeleton for the NewPaotang modular platform.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Public Tenant
  - name: System Auth
  - name: Customer
  - name: Customer Auth
  - name: Central Admin
  - name: Tenant Admin
  - name: Realtime
  - name: Partner Sync
  - name: Webhooks
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Platform health summary
      responses:
        "200":
          description: Health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: Application process is live
  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Readiness probe
      responses:
        "200":
          description: Database and Redis/Valkey are ready
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /public/site-config:
    get:
      tags: [Public Tenant]
      security: []
      summary: Resolve tenant site configuration by request host
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Tenant site configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteConfigResponse"
        "404":
          $ref: "#/components/responses/TenantNotFound"
        "409":
          $ref: "#/components/responses/DomainNotActive"
  /public/seo/page:
    get:
      tags: [Public Tenant]
      security: []
      summary: Tenant-aware SEO metadata for a public path
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SEO metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoMetadata"
        "404":
          $ref: "#/components/responses/TenantNotFound"
  /public/news:
    get:
      tags: [Public Tenant]
      security: []
      summary: Tenant public news/banner list for customer home
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Tenant public news items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsListResponse"
  /public/stores:
    get:
      tags: [Public Tenant]
      security: []
      summary: Search tenant seller/store list for customer store flow
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Tenant stores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreListResponse"
  /public/games/current:
    get:
      tags: [Public Tenant]
      security: []
      summary: Current tenant game for public buy flow
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Current game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/MaintenanceActive"

  /public/stock/search:
    get:
      tags: [Public Tenant]
      security: []
      summary: Search tenant-local stock
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: game_id
          in: query
          required: true
          schema:
            type: string
        - name: number
          in: query
          required: false
          schema:
            type: string
          description: Full or partial 6-digit search value. Empty value can request browse/random stock.
        - name: front3
          in: query
          required: false
          schema:
            type: string
          description: Optional explicit front-3 filter. Backend may derive this from number when possible.
        - name: back3
          in: query
          required: false
          schema:
            type: string
          description: Optional explicit back-3 filter. Backend may derive this from number when possible.
        - name: back2
          in: query
          required: false
          schema:
            type: string
          description: Optional explicit back-2 filter. Backend may derive this from number when possible.
        - name: store_id
          in: query
          required: false
          schema:
            type: string
          description: Optional seller/store filter for the existing customer store flow.
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [search, browse, random]
            default: search
          description: Supports existing customer browse/refresh/search UI without changing UI flow.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Search results from tenant-local stock only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalStockSearchResponse"
        "503":
          $ref: "#/components/responses/MaintenanceActive"
  /auth/admin/login:
    post:
      tags: [System Auth]
      security: []
      summary: Login to back-office as central or tenant admin
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Admin auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/refresh:
    post:
      tags: [System Auth]
      security: []
      summary: Refresh admin access token
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Refreshed admin auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/logout:
    post:
      tags: [System Auth]
      summary: Revoke current admin session
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "204":
          description: Admin session revoked
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/me:
    get:
      tags: [System Auth]
      summary: Current admin profile, scopes, tenants, and permissions
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Current admin session profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionProfile"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/password/forgot:
    post:
      tags: [System Auth]
      security: []
      summary: Request admin password reset
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Password reset request accepted
  /auth/admin/password/reset:
    post:
      tags: [System Auth]
      security: []
      summary: Reset admin password with reset token
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Admin password reset
  /auth/admin/password/change:
    post:
      tags: [System Auth]
      summary: Change current admin password
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Admin password changed
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/2fa:
    get:
      tags: [System Auth]
      summary: View admin two-factor status
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Admin two-factor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResource"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
    delete:
      tags: [System Auth]
      summary: Disable admin two-factor authentication
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "204":
          description: Admin two-factor disabled
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/2fa/setup:
    post:
      tags: [System Auth]
      summary: Start admin two-factor setup
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: Admin two-factor setup secret and recovery context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResource"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/2fa/enable:
    post:
      tags: [System Auth]
      summary: Enable admin two-factor authentication after setup verification
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: Admin two-factor enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResource"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "409":
          $ref: "#/components/responses/ResourceConflict"
  /auth/admin/2fa/recovery-codes:
    post:
      tags: [System Auth]
      summary: Rotate admin two-factor recovery codes
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: Admin recovery codes rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResource"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/admin/2fa/verify:
    post:
      tags: [System Auth]
      security: []
      summary: Verify admin two-factor challenge
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTwoFactorVerifyRequest"
      responses:
        "200":
          description: Admin auth session after two-factor verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /admin/central/realtime/auth:
    post:
      tags: [Realtime]
      summary: Authorize central admin private realtime channel subscription
      parameters:
        - $ref: "#/components/parameters/CentralAdminScopeHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeAuthRequest"
      responses:
        "200":
          description: Realtime channel authorization payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeAuthResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /customer/auth/register:
    post:
      tags: [Customer Auth]
      security: []
      summary: Register customer member under tenant host context
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRegisterRequest"
      responses:
        "201":
          description: Customer auth token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthResponse"
        "409":
          $ref: "#/components/responses/ResourceConflict"
  /customer/auth/login:
    post:
      tags: [Customer Auth]
      security: []
      summary: Customer login by phone/username and password
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerLoginRequest"
      responses:
        "200":
          description: Customer auth token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthResponse"
  /customer/auth/refresh:
    post:
      tags: [Customer Auth]
      security: []
      summary: Refresh customer access token
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Refreshed customer auth token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /customer/auth/logout:
    post:
      tags: [Customer Auth]
      summary: Revoke current customer session
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "204":
          description: Customer session revoked
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /customer/auth/me:
    get:
      tags: [Customer Auth]
      summary: Current customer profile
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Current customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /customer/profile:
    get:
      tags: [Customer]
      summary: Load customer member profile
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
    patch:
      tags: [Customer]
      summary: Update customer member profile
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateProfileRequest"
      responses:
        "200":
          description: Customer profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /customer/auth/line/login:
    post:
      tags: [Customer Auth]
      security: []
      summary: Create LINE login redirect URL
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                store_id:
                  type: string
                  nullable: true
      responses:
        "200":
          description: LINE redirect URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalLoginRedirect"
  /customer/auth/line/callback:
    get:
      tags: [Customer Auth]
      security: []
      summary: Complete LINE login callback
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Customer auth token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAuthResponse"
  /customer/realtime/auth:
    post:
      tags: [Realtime]
      security:
        - bearerAuth: []
      summary: Authorize customer private realtime channel subscription
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeAuthRequest"
      responses:
        "200":
          description: Realtime channel authorization payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeAuthResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /customer/cart:
    get:
      tags: [Customer]
      security:
        - bearerAuth: []
      summary: Load customer active cart and reservations
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Active cart state from server source of truth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "503":
          $ref: "#/components/responses/MaintenanceActive"
  /customer/reservations:
    post:
      tags: [Customer]
      security:
        - bearerAuth: []
      summary: Reserve tenant-local stock
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "409":
          $ref: "#/components/responses/ResourceConflict"
        "503":
          $ref: "#/components/responses/MaintenanceActive"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /customer/reservations/{reservation_id}/release:
    post:
      tags: [Customer]
      security:
        - bearerAuth: []
      summary: Release an active reservation
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: reservation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reservation released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "503":
          $ref: "#/components/responses/MaintenanceActive"
  /customer/checkout:
    post:
      tags: [Customer]
      security:
        - bearerAuth: []
      summary: Checkout a reservation with wallet/payment contract
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: Order paid or payment initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          $ref: "#/components/responses/ResourceConflict"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "503":
          $ref: "#/components/responses/MaintenanceActive"
  /customer/wallet:
    get:
      tags: [Customer]
      security:
        - bearerAuth: []
      summary: Load customer wallet summary for checkout/topup flow
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Customer wallets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /customer/orders/{order_id}:
    get:
      tags: [Customer]
      security:
        - bearerAuth: []
      summary: Load customer order/receipt for success page
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /customer/tickets:
    get:
      tags: [Customer]
      security:
        - bearerAuth: []
      summary: List customer tickets
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Paginated tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "503":
          $ref: "#/components/responses/MaintenanceActive"
  /customer/tickets/history:
    get:
      tags: [Customer]
      security:
        - bearerAuth: []
      summary: List customer historical tickets
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [cancelled, non_winning, paid_out, voided]
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Historical tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "503":
          $ref: "#/components/responses/MaintenanceActive"
  /customer/tickets/{ticket_id}:
    get:
      tags: [Customer]
      security:
        - bearerAuth: []
      summary: Load customer ticket detail
      parameters:
        - $ref: "#/components/parameters/TenantHostHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: ticket_id
