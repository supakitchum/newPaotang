          type: string
        prizes:
          type: array
          minItems: 173
          description: Thai Government Lottery prize rows only. Games get a draft reward template automatically; this payload records the official draw numbers and payout amounts. Amounts are editable, but every row in the same prize group must use the same THB amount.
          items:
            type: object
            required: [prize_type, prize_number, amount]
            properties:
              prize_type:
                type: string
                enum: [first_prize, near_first_prize, second_prize, third_prize, fourth_prize, fifth_prize, front3, back3, back2]
              prize_number:
                type: string
                description: Six digits for main and near-first prizes, three digits for front3/back3, and two digits for back2.
              amount:
                $ref: "#/components/schemas/Money"
    UpdateRewardResultRequest:
      type: object
      description: Update a reward result. Send either a full prizes snapshot, partial prize number updates, or payout amount updates.
      properties:
        prizes:
          $ref: "#/components/schemas/CreateRewardResultRequest/properties/prizes"
        prize_number_updates:
          type: array
          description: Partial winning-number updates. Missing groups or pending numbers remain unchanged; reward checking runs only after all prize rows are complete.
          items:
            type: object
            required: [prize_type, prize_numbers]
            properties:
              prize_type:
                type: string
                enum: [first_prize, near_first_prize, second_prize, third_prize, fourth_prize, fifth_prize, front3, back3, back2]
              prize_numbers:
                type: array
                items:
                  type: string
        payout_amount_updates:
          type: array
          description: Partial payout updates. Each amount applies to every row in that prize group.
          items:
            type: object
            required: [prize_type, amount]
            properties:
              prize_type:
                type: string
                enum: [first_prize, near_first_prize, second_prize, third_prize, fourth_prize, fifth_prize, front3, back3, back2]
