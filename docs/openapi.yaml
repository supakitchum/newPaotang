          $ref: "#/components/responses/ResourceConflict"
  /admin/tenant/support-access/{support_access_id}/impersonate:
    post:
      tags: [Tenant Admin]
      summary: Start approved support impersonation session
      parameters:
        - $ref: "#/components/parameters/TenantAdminScopeHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: support_access_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: Support impersonation session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ResourceConflict"
  /admin/tenant/support-access/{support_access_id}/elevated-actions:
    post:
      tags: [Tenant Admin]
      summary: Request or record an elevated action during support access
      parameters:
        - $ref: "#/components/parameters/TenantAdminScopeHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: support_access_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "202":
          description: Support elevated action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ResourceConflict"
  /admin/tenant/support-access/{support_access_id}/end-session:
    post:
      tags: [Tenant Admin]
      summary: End active support impersonation session
      parameters:
        - $ref: "#/components/parameters/TenantAdminScopeHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: support_access_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActionRequest"
      responses:
        "200":
          description: Support impersonation session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          $ref: "#/components/responses/ResourceConflict"

  /partner-sync/allocations:
    get:
      tags: [Partner Sync]
      summary: Pull allocation chunks by cursor
      parameters:
        - $ref: "#/components/parameters/PartnerIdHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20000
            default: 5000
      responses:
        "200":
          description: Allocation chunk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationPullResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /partner-sync/events:
    post:
      tags: [Partner Sync]
      summary: Submit partner event batch to central inbox
      parameters:
        - $ref: "#/components/parameters/PartnerIdHeader"
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatchRequest"
      responses:
        "202":
          description: Batch accepted into inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBatchAccepted"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /webhooks/payments/{provider}:
    post:
      tags: [Webhooks]
      security: []
      summary: Receive payment provider callback
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: X-Signature
          in: header
          required: false
          schema:
            type: string
          description: Provider-specific callback signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCallbackRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WebhookCallbackRequest"
      responses:
        "202":
          description: Payment callback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookCallbackAccepted"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "409":
          $ref: "#/components/responses/ResourceConflict"
  /webhooks/topups/{provider}:
    post:
      tags: [Webhooks]
      security: []
      summary: Receive topup/payment provider callback
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: X-Signature
          in: header
          required: false
          schema:
            type: string
          description: Provider-specific callback signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCallbackRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WebhookCallbackRequest"
      responses:
        "202":
          description: Topup callback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookCallbackAccepted"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "409":
          $ref: "#/components/responses/ResourceConflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Customer, admin, partner API, service worker, or support impersonation token depending on endpoint audience.
  parameters:
    TenantHostHeader:
      name: Host
      in: header
      required: true
      description: Tenant public domain used by backend tenant resolution.
      schema:
        type: string
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CentralAdminScopeHeader:
      name: X-Admin-Scope
      in: header
      required: true
      description: Must be central for central admin endpoints.
      schema:
        type: string
        enum: [central]
    TenantAdminScopeHeader:
      name: X-Admin-Scope
      in: header
      required: true
      description: Must be tenant for tenant admin endpoints.
      schema:
        type: string
        enum: [tenant]
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
    PartnerIdHeader:
      name: X-Partner-Id
      in: header
      required: true
      schema:
        type: string
  responses:
    AuthenticationRequired:
      description: Authentication token is missing, invalid, expired, or revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PermissionDenied:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TenantNotFound:
      description: Tenant/domain not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DomainNotActive:
      description: Tenant domain exists but is not active, verified, or ready for public traffic
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResourceConflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MaintenanceActive:
      description: Tenant maintenance is active
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service unavailable or overloaded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
        currency:
          type: string
          example: THB
    DashboardSummary:
      type: object
      required: [scope, generated_at, kpis]
      properties:
        scope:
          type: string
          enum: [central, tenant]
        tenant_id:
          type: string
          nullable: true
        generated_at:
          type: string
          format: date-time
        kpis:
          type: object
          additionalProperties: true
        charts:
          type: object
          additionalProperties: true
        alerts:
          type: array
          items:
            type: object
            additionalProperties: true
    AdminResourceListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminResource"
        meta:
          $ref: "#/components/schemas/CursorMeta"
    AdminResource:
      type: object
      required: [id]
      properties:
        id:
          type: string
        tenant_id:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true
    AdminCreateRequest:
      type: object
      additionalProperties: true
    AdminPatchRequest:
      type: object
      additionalProperties: true
    AdminActionRequest:
      type: object
      properties:
        reason:
          type: string
          description: Required for audited admin actions when applicable.
        note:
          type: string
          nullable: true
        notify:
          type: boolean
          nullable: true
      additionalProperties: true
    LotteryImageBackgroundAssetSetList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LotteryImageBackgroundAssetSet"
        meta:
          type: object
          required: [game_id, version, required_set_types]
          properties:
            game_id:
              type: string
            version:
              type: string
            required_set_types:
              type: array
              items:
                type: string
                enum: [odd, even, charity]
    LotteryImageBackgroundAssetSet:
      type: object
      required: [id, game_id, version, set_type, position, status, ready, generation_ready, missing_assets, assets]
      properties:
        id:
          type: string
        game_id:
          type: string
        version:
          type: string
        set_type:
          type: string
          enum: [odd, even, charity]
        position:
          type: integer
          minimum: 1
          description: Ordered background position derived from zip names such as 001.png.
        status:
          type: string
          enum: [ready, inactive, retired]
        ready:
          type: boolean
        generation_ready:
          type: boolean
        missing_assets:
          type: array
          items:
            type: string
            enum: [source, full, thumb]
        assets:
          type: object
          required: [source, full, thumb]
          properties:
            source:
              $ref: "#/components/schemas/LotteryImageBackgroundAsset"
            full:
              $ref: "#/components/schemas/LotteryImageBackgroundAsset"
            thumb:
              $ref: "#/components/schemas/LotteryImageBackgroundAsset"
        activated_at:
          type: string
          format: date-time
          nullable: true
        retired_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        updated_by:
          type: string
          nullable: true
    LotteryImageBackgroundAsset:
      type: object
      required: [asset_id, storage_path, content_type, width, height, size_bytes, storage_available]
      properties:
        asset_id:
          type: string
          nullable: true
        storage_path:
          type: string
          nullable: true
        content_type:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        size_bytes:
          type: integer
          nullable: true
        storage_available:
          type: boolean
    LotteryImageBackgroundAssetSetUpsertRequest:
      type: object
      required: [game_id, version, set_type, assets]
      properties:
        game_id:
          type: string
        version:
          type: string
          example: v1
        set_type:
          type: string
          enum: [odd, even, charity]
        status:
          type: string
          enum: [ready, inactive, retired]
          default: ready
        supersede_existing:
          type: boolean
          default: false
        assets:
          type: object
          required: [source, full, thumb]
          properties:
            source:
              type: object
              required: [asset_id]
              properties:
                asset_id:
                  type: string
            full:
              type: object
              required: [asset_id]
              properties:
                asset_id:
                  type: string
            thumb:
              type: object
              required: [asset_id]
              properties:
                asset_id:
                  type: string
    LotteryImageBackgroundZipImportRequest:
      type: object
      required: [game_id, version, set_type, expected_count, zip]
      properties:
        game_id:
          type: string
        version:
          type: string
          example: v1
        set_type:
          type: string
          enum: [odd, even, charity]
        expected_count:
          type: integer
          minimum: 1
          maximum: 100
          description: Exact number of ordered root-level PNG files expected in the zip.
        status:
          type: string
          enum: [ready, inactive, retired]
          default: ready
        supersede_existing:
          type: boolean
          default: false
        zip:
          type: string
          format: binary
          description: Root-level PNG-only zip containing 001.png, 002.png, and so on. Maximum upload size follows the running PHP upload_max_filesize and post_max_size limits.
    LotteryImageBackgroundZipImportResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LotteryImageBackgroundAssetSet"
        meta:
          type: object
          required: [game_id, version, set_type, imported_count, expected_count]
          properties:
            game_id:
              type: string
            version:
              type: string
            set_type:
              type: string
              enum: [odd, even, charity]
            imported_count:
              type: integer
            expected_count:
              type: integer
    LotteryImageBackgroundAssetSetStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, inactive, retired]
        supersede_existing:
          type: boolean
          default: false
    LotteryImagePreviewRequest:
      type: object
      required: [game_id, version, set_type, lottery_number]
      properties:
        game_id:
          type: string
        version:
          type: string
          example: v1
        set_type:
          type: string
          enum: [odd, even, charity]
        lottery_number:
          type: string
          pattern: "^[0-9]{1,6}$"
        partner_id:
          type: string
          nullable: true
          description: Optional partner to use only when mode is explicitly partner_branded.
        mode:
          type: string
          enum: [central_unbranded, partner_branded]
          default: central_unbranded
        variant:
          type: string
          enum: [full, thumb]
          default: full
    LotteryImagePartnerBrandingPreviewRequest:
      type: object
      required: [game_id, version, set_type, lottery_number]
      properties:
        game_id:
          type: string
        version:
          type: string
          example: v1
        set_type:
          type: string
          enum: [odd, even, charity]
        lottery_number:
          type: string
          pattern: "^[0-9]{1,6}$"
        partner_id:
          type: string
          nullable: true
          description: If supplied, it must match the route partner_id; otherwise the route partner_id is used.
        variant:
          type: string
          enum: [full, thumb]
          default: full
    LotteryImagePreviewResponse:
      type: object
      required: [mode, requested_mode, warnings, game_id, version, set_type, lottery_number, variant, content_type, width, height, image_base64, data_url, side_effects]
      properties:
        mode:
          type: string
          enum: [central_unbranded, partner_branded]
        requested_mode:
          type: string
          enum: [central_unbranded, partner_branded]
        fallback_mode:
          type: string
          enum: [central_unbranded, partner_branded]
          nullable: true
        warnings:
          type: array
          items:
            type: string
          description: Includes partner_branding_assets_not_ready when branded preview falls back to central_unbranded.
        game_id:
          type: string
        version:
          type: string
        set_type:
          type: string
          enum: [odd, even, charity]
        partner_id:
          type: string
          nullable: true
        lottery_number:
          type: string
          description: Six-digit normalized preview number.
        variant:
          type: string
          enum: [full, thumb]
        content_type:
          type: string
          enum: [image/webp]
        width:
          type: integer
        height:
          type: integer
        image_base64:
          type: string
          format: byte
        data_url:
          type: string
        side_effects:
          type: object
          required: [stock_rows_created, permanent_image_rows_created, branding_locked]
          properties:
            stock_rows_created:
              type: integer
              enum: [0]
            permanent_image_rows_created:
              type: integer
              enum: [0]
            branding_locked:
              type: boolean
              enum: [false]
    LotteryImageMix:
      type: object
      required: [game_id, source, mix]
      properties:
        game_id:
          type: string
        source:
          type: string
          enum: [default_config, persisted]
        mix:
          type: object
          required: [odd, even, charity]
          properties:
            odd:
              type: integer
              minimum: 0
              maximum: 100
            even:
              type: integer
              minimum: 0
              maximum: 100
            charity:
              type: integer
              minimum: 0
              maximum: 100
        updated_at:
          type: string
          format: date-time
          nullable: true
        updated_by:
          type: string
          nullable: true
    LotteryImageMixUpdateRequest:
      type: object
      required: [game_id, mix]
      properties:
        game_id:
          type: string
        mix:
          type: object
          required: [odd, even, charity]
          properties:
            odd:
              type: integer
              minimum: 0
              maximum: 100
            even:
              type: integer
              minimum: 0
              maximum: 100
            charity:
              type: integer
              minimum: 0
              maximum: 100
    LotteryImageReadiness:
      type: object
      required: [game_id, version, backgrounds, missing_set_types, pending_assets, failed_generation, storage_readiness, queue_readiness]
      properties:
        game_id:
          type: string
        batch_id:
          type: string
          nullable: true
        version:
          type: string
        backgrounds:
          type: array
          items:
            type: object
            additionalProperties: true
        missing_set_types:
          type: array
          items:
            type: string
            enum: [odd, even, charity]
        pending_assets:
          $ref: "#/components/schemas/LotteryImageStatusCounts"
        failed_generation:
          $ref: "#/components/schemas/LotteryImageStatusCounts"
        last_error_samples:
          type: array
          items:
            type: object
            additionalProperties: true
        mix:
          $ref: "#/components/schemas/LotteryImageMix"
        storage_readiness:
          $ref: "#/components/schemas/LotteryImageProductionReadiness"
        queue_readiness:
          $ref: "#/components/schemas/LotteryImageQueueReadiness"
    LotteryImageStatusCounts:
      type: object
      required: [central, partner, total]
      properties:
        central:
          type: integer
        partner:
          type: integer
        total:
          type: integer
    LotteryImageRetryPendingRequest:
      type: object
      properties:
        game_id:
          type: string
          nullable: true
        batch_id:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        set_types:
          type: array
          nullable: true
          items:
            type: string
            enum: [odd, even, charity]
        dry_run:
          type: boolean
          default: false
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
    LotteryImageRetryPendingResponse:
      type: object
      required: [dry_run, limit, filters, central, partner]
      properties:
        dry_run:
          type: boolean
        limit:
          type: integer
        filters:
          type: object
          additionalProperties: true
        central:
          type: object
          required: [ready_count, dispatched_count, queue]
          properties:
            ready_count:
              type: integer
            dispatched_count:
              type: integer
            queue:
              type: string
        partner:
          type: object
          required: [ready_count, dispatched_count, queue]
          properties:
            ready_count:
              type: integer
            dispatched_count:
              type: integer
            queue:
              type: string
    LotteryImageProductionReadiness:
      type: object
      required: [configured, disk, bucket_present, region_present, endpoint_present, cdn_base_url_present, queue_configured, runtime_webp_ready, secrets_redacted, production_ready, blocking_reasons]
      properties:
        configured:
          type: boolean
        disk:
          type: string
        disk_driver:
          type: string
          nullable: true
        bucket_present:
          type: boolean
        region_present:
          type: boolean
        endpoint_present:
          type: boolean
        cdn_base_url_present:
          type: boolean
        queue_configured:
          type: boolean
        runtime_webp_ready:
          type: boolean
        secrets_redacted:
          type: boolean
        production_ready:
          type: boolean
        blocking_reasons:
          type: array
          items:
            type: string
        queues:
          $ref: "#/components/schemas/LotteryImageQueueReadiness"
    LotteryImageQueueReadiness:
      type: object
      required: [queue_configured, jobs_can_run, connection, required_queue_names, central_queue, partner_queue]
      properties:
        queue_configured:
          type: boolean
        jobs_can_run:
          type: boolean
        connection:
          type: string
        required_queue_names:
          type: array
          items:
            type: string
        central_queue:
          type: string
        partner_queue:
          type: string
        worker_commands:
          type: array
          items:
            type: string
    RealtimeAuthRequest:
      type: object
      required: [socket_id, channel_name]
      properties:
        socket_id:
          type: string
          description: Reverb/Echo socket id from the connecting client.
        channel_name:
          type: string
